<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF to Image – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Inter,system-ui;color:#111;
background:
radial-gradient(circle at 15% 20%,#fde68a,transparent 40%),
radial-gradient(circle at 85% 80%,#a7f3d0,transparent 45%),
linear-gradient(135deg,#fff7ed,#ecfeff);
min-height:100vh;display:flex;justify-content:center;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;
padding:10px 16px;border-radius:999px;
background:#fff;text-decoration:none;color:#111;
font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.12);z-index:999;
}

/* CARD */
.card{
margin:90px auto 50px;width:95%;max-width:980px;
background:#fff;padding:56px 52px 58px;border-radius:36px;
box-shadow:0 38px 90px rgba(0,0,0,.18);text-align:center;
}
h1{margin:0;font-size:34px}
.subtitle{margin:18px 0 40px;font-size:15px;color:#555;line-height:1.8}

/* UPLOAD */
.upload{
position:relative;margin:0 auto 26px;max-width:560px;height:92px;
display:flex;align-items:center;justify-content:center;gap:10px;
border:2px dashed #f59e0b;border-radius:16px;background:#fff7ed;
font-size:16px;font-weight:600;color:#92400e;cursor:pointer;
}
.upload:hover{background:#ffedd5}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* PDF LIST */
.pdfs{
max-width:720px;margin:18px auto 6px;text-align:left;
}
.pdf{
background:#f8fafc;border-radius:14px;padding:10px 12px;
display:flex;justify-content:space-between;align-items:center;
margin-bottom:8px;font-size:14px;
box-shadow:0 4px 10px rgba(0,0,0,.06);
}
.pdf button{
border:none;background:#fee2e2;color:#991b1b;
padding:4px 10px;border-radius:8px;cursor:pointer;
}

/* OPTIONS */
.opts{
max-width:560px;margin:16px auto 10px;
display:flex;gap:12px;justify-content:center
}
select{
padding:10px 14px;border-radius:12px;border:1px solid #e5e7eb;
font-family:Inter;font-size:14px
}

/* PREVIEW */
.grid{
max-width:920px;margin:22px auto 0;
display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;
}
.thumb{
background:#f8fafc;border-radius:16px;padding:10px;
box-shadow:0 6px 14px rgba(0,0,0,.08);font-size:12px
}
.thumb img{width:100%;height:140px;object-fit:contain;border-radius:10px;margin-bottom:6px}

/* BUTTONS */
.actions{
margin-top:46px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap
}
.main-btn{
padding:16px 46px;border-radius:32px;border:none;
font-size:16px;font-weight:600;cursor:pointer;color:#fff
}
.normal{
background:linear-gradient(135deg,#22c55e,#16a34a);
box-shadow:0 18px 40px rgba(34,197,94,.45)
}
.zip{
background:linear-gradient(135deg,#f59e0b,#ea580c);
box-shadow:0 18px 40px rgba(234,88,12,.45)
}

/* FOOTER */
.footer{margin-top:46px;font-size:13px;color:#666;line-height:1.6}

@media(max-width:600px){
.card{padding:38px 22px}
.upload{height:82px}
.thumb img{height:120px}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<h1>PDF to Image</h1>

<p class="subtitle">
Convert pages from multiple PDFs into images.<br>
All processing happens inside your browser.
</p>

<div class="upload">
📄 Tap to select PDF files
<input type="file" accept="application/pdf" multiple id="pdfInput">
</div>

<div class="pdfs" id="pdfList"></div>

<div class="opts">
<select id="format">
  <option value="png">PNG</option>
  <option value="jpeg">JPG</option>
</select>
<select id="scale">
  <option value="1.5">Normal</option>
  <option value="2">High</option>
  <option value="3">Ultra</option>
</select>
</div>

<div class="grid" id="preview"></div>

<div class="actions">
<button class="main-btn normal" onclick="downloadImages()">Download Images</button>
<button class="main-btn zip" onclick="downloadZIP()">Download ZIP</button>
</div>

<div class="footer">
📄 Multi-PDF • 🖼️ PNG/JPG • 🔒 Private • 🚫 No upload
</div>

</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const input=document.getElementById("pdfInput");
const pdfList=document.getElementById("pdfList");
const preview=document.getElementById("preview");
const formatSel=document.getElementById("format");
const scaleSel=document.getElementById("scale");

let pdfFiles=[];     // File[]
let rendered=[];     // {blob,name}

input.addEventListener("change",()=>{
for(const f of input.files){
if(!pdfFiles.find(x=>x.name===f.name && x.size===f.size)){
pdfFiles.push(f);
}
}
input.value="";
renderPDFList();
renderAll();
});

function renderPDFList(){
pdfList.innerHTML="";
pdfFiles.forEach((f,i)=>{
const div=document.createElement("div");
div.className="pdf";
div.innerHTML=`<span>${i+1}. ${f.name}</span>
<button onclick="removePDF(${i})">Remove</button>`;
pdfList.appendChild(div);
});
}

function removePDF(i){
pdfFiles.splice(i,1);
renderPDFList();
renderAll();
}

async function renderAll(){
preview.innerHTML=""; rendered=[];
if(!pdfFiles.length) return;

const fmt=formatSel.value;
const scale=parseFloat(scaleSel.value);

for(const file of pdfFiles){
const array=await file.arrayBuffer();
const pdf=await pdfjsLib.getDocument({data:array}).promise;

for(let p=1;p<=pdf.numPages;p++){
const page=await pdf.getPage(p);
const viewport=page.getViewport({scale});
const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");
canvas.width=viewport.width;
canvas.height=viewport.height;

await page.render({canvasContext:ctx,viewport}).promise;

const mime=fmt==="png"?"image/png":"image/jpeg";
const blob=await new Promise(r=>canvas.toBlob(r,mime,0.95));
const name=`${file.name.replace(".pdf","")}-page-${p}.${fmt}`;
rendered.push({blob,name});

const url=URL.createObjectURL(blob);
const div=document.createElement("div");
div.className="thumb";
div.innerHTML=`<img src="${url}"><div>${file.name} • Page ${p}</div>`;
preview.appendChild(div);
}
}
}

function downloadImages(){
if(!rendered.length){alert("Please select PDF files first");return;}
rendered.forEach(f=>{
const a=document.createElement("a");
a.href=URL.createObjectURL(f.blob);
a.download=f.name;
a.click();
URL.revokeObjectURL(a.href);
});
}

async function downloadZIP(){
if(!rendered.length){alert("Please select PDF files first");return;}
const zip=new JSZip();
rendered.forEach(f=>zip.file(f.name,f.blob));
const out=await zip.generateAsync({type:"blob"});
const a=document.createElement("a");
a.href=URL.createObjectURL(out);
a.download="pdf-images.zip";
a.click();
URL.revokeObjectURL(a.href);
}
</script>

</body>
</html>
