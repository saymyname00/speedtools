<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text Sorter – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 18% 22%,#a7f3d0,transparent 40%),
radial-gradient(circle at 82% 78%,#fde68a,transparent 45%),
linear-gradient(135deg,#f8fafc,#ecfeff);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#111;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;
text-decoration:none;font-size:14px;font-weight:600;
padding:8px 14px;border-radius:999px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
color:#111;
box-shadow:0 10px 26px rgba(0,0,0,.12);
transition:.2s;z-index:999;
}
.home-btn:hover{transform:translateY(-1px)}

/* CARD */
.card{
width:95%;max-width:1100px;
background:#fff;padding:26px;
border-radius:26px;
box-shadow:0 28px 60px rgba(0,0,0,.15);
}

.header{
display:flex;justify-content:space-between;align-items:center;margin-bottom:8px
}
.header h1{font-size:30px;margin:0}
.badge{
font-size:12px;
background:linear-gradient(135deg,#22c55e,#4ade80);
color:#052e16;
padding:6px 12px;border-radius:999px
}
.subtitle{font-size:14px;color:#555;margin-bottom:14px}

/* LAYOUT */
.main{
display:grid;grid-template-columns:1fr 1fr;gap:18px
}

/* TEXTAREAS */
textarea{
width:100%;height:230px;
padding:18px;font-size:14px;
border-radius:18px;border:1px solid #ddd;
resize:none;outline:none;
font-family:Inter;background:#f9fafb;
}
textarea:focus{
border-color:#22c55e;
box-shadow:0 0 0 3px rgba(34,197,94,.15);
background:#fff;
}

/* OPTIONS */
.options{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;margin-top:12px;
}
button{
padding:12px;border-radius:14px;border:none;
font-size:14px;font-family:Inter;
cursor:pointer;transition:.15s;
}
button:active{transform:scale(.96)}
.sort{
background:linear-gradient(135deg,#22c55e,#4ade80);
color:#052e16;
box-shadow:0 10px 30px rgba(34,197,94,.4)
}
.gray{background:#e5e7eb}

/* CHECKS */
.checks{
display:flex;gap:14px;margin-top:12px;font-size:13px;color:#444
}
.checks label{display:flex;align-items:center;gap:6px}
.checks input{accent-color:#22c55e}

/* STATS */
.stats{
display:grid;grid-template-columns:repeat(3,1fr);
gap:10px;margin-top:12px
}
.stat{
background:linear-gradient(135deg,#f0fdf4,#ecfeff);
padding:12px;border-radius:14px;text-align:center;
font-size:13px;box-shadow:0 6px 14px rgba(0,0,0,.08)
}
.stat strong{display:block;font-size:22px}

/* FOOTER */
.footer{
margin-top:12px;text-align:center;
font-size:12px;color:#666
}

/* MOBILE */
@media(max-width:900px){
.main{grid-template-columns:1fr}
textarea{height:190px}
.options{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
<h1>Text Sorter</h1>
<div class="badge">Fast & Clean</div>
</div>

<p class="subtitle">
Sort lines alphabetically, by length, or randomly — instantly.
</p>

<div class="main">
<textarea id="input" placeholder="Paste text here (one line per item)..."></textarea>
<textarea id="output" placeholder="Sorted result will appear here..." readonly></textarea>
</div>

<div class="options">
<button class="sort" onclick="sortAZ()">A → Z</button>
<button class="sort" onclick="sortZA()">Z → A</button>
<button class="sort" onclick="sortLength()">By Length</button>
<button class="sort" onclick="shuffle()">Random</button>
</div>

<div class="checks">
<label><input type="checkbox" id="caseSensitive"> Case sensitive</label>
<label><input type="checkbox" id="trimSpaces" checked> Trim spaces</label>
</div>

<div class="stats">
<div class="stat"><strong id="total">0</strong>Total Lines</div>
<div class="stat"><strong id="chars">0</strong>Total Chars</div>
<div class="stat"><strong id="longest">0</strong>Longest Line</div>
</div>

<div class="footer">
🔤 Sort text • 🔒 Private • 🚫 No login • Browser based
</div>

</div>

<script>
const input=document.getElementById("input");
const output=document.getElementById("output");
const totalEl=document.getElementById("total");
const charsEl=document.getElementById("chars");
const longestEl=document.getElementById("longest");

function getLines(){
let lines=input.value.split("\n");
if(trimSpaces.checked) lines=lines.map(l=>l.trim());
lines=lines.filter(l=>l!=="");
return lines;
}

function updateStats(lines){
totalEl.textContent=lines.length;
charsEl.textContent=lines.join("").length;
longestEl.textContent=lines.reduce((m,l)=>Math.max(m,l.length),0);
}

function render(lines){
output.value=lines.join("\n");
updateStats(lines);
}

function sortAZ(){
let lines=getLines();
lines.sort((a,b)=>{
if(caseSensitive.checked) return a.localeCompare(b);
return a.toLowerCase().localeCompare(b.toLowerCase());
});
render(lines);
}

function sortZA(){
let lines=getLines();
lines.sort((a,b)=>{
if(caseSensitive.checked) return b.localeCompare(a);
return b.toLowerCase().localeCompare(a.toLowerCase());
});
render(lines);
}

function sortLength(){
let lines=getLines();
lines.sort((a,b)=>a.length-b.length);
render(lines);
}

function shuffle(){
let lines=getLines();
for(let i=lines.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[lines[i],lines[j]]=[lines[j],lines[i]];
}
render(lines);
}
</script>

</body>
</html>
