<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF Merge – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 20% 20%,#fde68a,transparent 40%),
radial-gradient(circle at 80% 80%,#bfdbfe,transparent 45%),
linear-gradient(135deg,#fefce8,#eff6ff);
min-height:100vh;
display:flex;
justify-content:center;
color:#111;
}

/* HOME */
.home-btn{
position:fixed;
top:18px;left:18px;
padding:10px 16px;
border-radius:999px;
background:#fff;
text-decoration:none;
color:#111;
font-weight:600;
box-shadow:0 10px 26px rgba(0,0,0,.12);
z-index:999;
}

/* CARD */
.card{
margin:90px auto 50px;
width:95%;
max-width:860px;
background:#fff;
padding:54px 48px 56px;
border-radius:34px;
box-shadow:0 35px 80px rgba(0,0,0,.18);
text-align:center;
}

h1{margin:0;font-size:34px}

.subtitle{
margin:18px 0 44px;
font-size:15px;
color:#555;
line-height:1.8;
}

/* ✅ UPLOAD BOX (FUNCTIONAL FIX ONLY) */
.upload{
position:relative;                 /* 👈 important */
margin:0 auto 32px;
width:100%;
max-width:520px;
height:90px;

display:flex;
align-items:center;
justify-content:center;
gap:10px;

border:2px dashed #60a5fa;
border-radius:16px;
background:#f8fafc;

font-size:16px;
font-weight:600;
color:#1e3a8a;

cursor:pointer;
transition:.2s;
}
.upload:hover{background:#eef2ff}

/* 👇 THIS FIXES FILE PICKING */
.upload input{
position:absolute;
inset:0;
opacity:0;
cursor:pointer;
}

/* FILE LIST */
.files{
max-width:720px;
margin:22px auto 0;
text-align:left;
}
.file{
background:#f1f5f9;
padding:16px 18px;
border-radius:16px;
margin-bottom:14px;
display:grid;
grid-template-columns:1fr auto;
gap:12px;
align-items:center;
}
.file-name{font-size:15px}
.file-controls{
display:flex;
gap:6px;
}
.file-controls button{
border:none;
padding:6px 10px;
border-radius:10px;
cursor:pointer;
font-size:13px;
}
.up,.down{background:#e0e7ff}
.del{background:#fee2e2;color:#991b1b}

/* MERGE BUTTON */
.main-btn{
margin-top:48px;
padding:16px 48px;
border-radius:30px;
border:none;
font-size:16px;
font-weight:600;
cursor:pointer;
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:#fff;
box-shadow:0 16px 36px rgba(79,70,229,.45);
}

/* FOOTER */
.footer{
margin-top:44px;
font-size:13px;
color:#666;
line-height:1.6;
}

/* MOBILE */
@media(max-width:600px){
.card{padding:38px 22px}
.upload{height:80px}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<h1>PDF Merge</h1>

<p class="subtitle">
Combine multiple PDF files into a single document.<br>
All processing happens inside your browser.
</p>

<div class="upload">
📄 Tap to select PDF
<input type="file" multiple accept="application/pdf" id="pdfInput">
</div>

<div class="files" id="fileList"></div>

<button class="main-btn" onclick="mergePDFs()">Merge PDFs</button>

<div class="footer">
📄 Secure • 🔒 Private • 🚫 No upload • Browser based
</div>

</div>

<script>
const input=document.getElementById("pdfInput");
const list=document.getElementById("fileList");
let files=[];

input.addEventListener("change",()=>{
for(const f of input.files){
if(!files.find(x=>x.name===f.name && x.size===f.size)){
files.push(f);
}
}
input.value="";
render();
});

function render(){
list.innerHTML="";
files.forEach((f,i)=>{
const div=document.createElement("div");
div.className="file";
div.innerHTML=`
<div class="file-name">${i+1}. ${f.name}</div>
<div class="file-controls">
<button class="up" onclick="moveUp(${i})">↑</button>
<button class="down" onclick="moveDown(${i})">↓</button>
<button class="del" onclick="removeFile(${i})">✕</button>
</div>
`;
list.appendChild(div);
});
}

function moveUp(i){
if(i>0){[files[i-1],files[i]]=[files[i],files[i-1]];render();}
}
function moveDown(i){
if(i<files.length-1){[files[i+1],files[i]]=[files[i],files[i+1]];render();}
}
function removeFile(i){
files.splice(i,1);
render();
}

async function mergePDFs(){
if(files.length<2){
alert("Please add at least 2 PDF files");
return;
}
const merged=await PDFLib.PDFDocument.create();
for(const f of files){
const bytes=await f.arrayBuffer();
const pdf=await PDFLib.PDFDocument.load(bytes);
const pages=await merged.copyPages(pdf,pdf.getPageIndices());
pages.forEach(p=>merged.addPage(p));
}
const blob=new Blob([await merged.save()],{type:"application/pdf"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;a.download="merged.pdf";a.click();
URL.revokeObjectURL(url);
}
</script>

</body>
</html>
