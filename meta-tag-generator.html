<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meta Tag Generator – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 18% 22%,#bbf7d0,transparent 40%),
radial-gradient(circle at 82% 78%,#bfdbfe,transparent 45%),
linear-gradient(135deg,#f0fdf4,#eff6ff);
min-height:100vh;
display:flex;align-items:center;justify-content:center;color:#111;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;
text-decoration:none;font-size:14px;font-weight:600;
padding:8px 14px;border-radius:999px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
color:#111;box-shadow:0 10px 26px rgba(0,0,0,.12);
transition:.2s;z-index:999;
}
.home-btn:hover{transform:translateY(-1px)}

/* CARD */
.card{
width:95%;max-width:1100px;
background:#fff;padding:26px;border-radius:26px;
box-shadow:0 28px 60px rgba(0,0,0,.15);
}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.header h1{font-size:30px;margin:0}
.badge{
font-size:12px;
background:linear-gradient(135deg,#22c55e,#3b82f6);
color:#fff;padding:6px 12px;border-radius:999px
}
.subtitle{font-size:14px;color:#555;margin-bottom:14px}

/* GRID */
.main{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

/* FORM */
label{font-size:13px;color:#555;display:block;margin-bottom:6px}
input, textarea, select{
width:100%;
padding:12px 14px;
border-radius:14px;border:1px solid #ddd;
font-size:14px;font-family:Inter;
background:#f9fafb;outline:none;margin-bottom:10px;
}
textarea{height:90px;resize:none}
input:focus, textarea:focus, select:focus{
border-color:#22c55e;
box-shadow:0 0 0 3px rgba(34,197,94,.15);
background:#fff;
}

/* ACTIONS */
.actions{display:flex;gap:12px;margin-top:6px}
button{
flex:1;padding:13px;border-radius:16px;border:none;
font-size:14px;font-family:Inter;cursor:pointer;transition:.15s;
}
button:active{transform:scale(.96)}
.gen{
background:linear-gradient(135deg,#22c55e,#4ade80);
color:#052e16;box-shadow:0 10px 30px rgba(34,197,94,.4)
}
.copy{background:#e5e7eb}

/* OUTPUT */
.output{
height:220px;padding:18px;border-radius:18px;
border:1px solid #ddd;background:#f9fafb;
font-size:13px;white-space:pre-wrap;overflow:auto;
}

/* STATS */
.stats{
display:grid;grid-template-columns:repeat(3,1fr);
gap:10px;margin-top:12px
}
.stat{
background:linear-gradient(135deg,#f0fdf4,#eff6ff);
padding:12px;border-radius:14px;text-align:center;
font-size:13px;box-shadow:0 6px 14px rgba(0,0,0,.08)
}
.stat strong{display:block;font-size:20px}

/* FOOTER */
.footer{margin-top:12px;text-align:center;font-size:12px;color:#666}

/* MOBILE */
@media(max-width:900px){
.main{grid-template-columns:1fr}
.output{height:190px}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
<h1>Meta Tag Generator</h1>
<div class="badge">SEO Gold</div>
</div>

<p class="subtitle">
Generate essential SEO meta tags (title, description, robots, Open Graph).
</p>

<div class="main">

<!-- LEFT -->
<div>
<label>Page Title</label>
<input id="title" placeholder="Best Free Online Tools – SpeedTools">

<label>Meta Description</label>
<textarea id="desc" placeholder="Free browser-based tools. No login, no tracking."></textarea>

<label>Canonical URL</label>
<input id="url" placeholder="https://example.com/page">

<label>Robots</label>
<select id="robots">
  <option value="index,follow">index, follow</option>
  <option value="noindex,follow">noindex, follow</option>
  <option value="index,nofollow">index, nofollow</option>
  <option value="noindex,nofollow">noindex, nofollow</option>
</select>

<label>OG Image URL (optional)</label>
<input id="image" placeholder="https://example.com/og-image.jpg">

<div class="actions">
  <button class="gen" onclick="generate()">Generate</button>
  <button class="copy" onclick="copy()">Copy</button>
</div>
</div>

<!-- RIGHT -->
<div>
<div class="output" id="output">&lt;!-- Meta tags will appear here --&gt;</div>

<div class="stats">
  <div class="stat"><strong id="tLen">0</strong>Title chars</div>
  <div class="stat"><strong id="dLen">0</strong>Description chars</div>
  <div class="stat"><strong id="lines">0</strong>Tags</div>
</div>
</div>

</div>

<div class="footer">
🏷️ SEO meta tags • 🔒 Private • 🚫 No login • Browser based
</div>

</div>

<script>
const titleEl=document.getElementById("title");
const descEl=document.getElementById("desc");
const urlEl=document.getElementById("url");
const robotsEl=document.getElementById("robots");
const imgEl=document.getElementById("image");
const out=document.getElementById("output");

const tLen=document.getElementById("tLen");
const dLen=document.getElementById("dLen");
const lines=document.getElementById("lines");

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function generate(){
const title=titleEl.value.trim();
const desc=descEl.value.trim();
const url=urlEl.value.trim();
const robots=robotsEl.value;
const img=imgEl.value.trim();

let tags=[];
if(title) tags.push(`<title>${esc(title)}</title>`);
if(desc) tags.push(`<meta name="description" content="${esc(desc)}">`);
if(robots) tags.push(`<meta name="robots" content="${robots}">`);
if(url) tags.push(`<link rel="canonical" href="${esc(url)}">`);

if(title) tags.push(`<meta property="og:title" content="${esc(title)}">`);
if(desc) tags.push(`<meta property="og:description" content="${esc(desc)}">`);
if(url) tags.push(`<meta property="og:url" content="${esc(url)}">`);
if(img) tags.push(`<meta property="og:image" content="${esc(img)}">`);
tags.push(`<meta property="og:type" content="website">`);

out.textContent=tags.join("\n");

tLen.textContent=title.length;
dLen.textContent=desc.length;
lines.textContent=tags.length;
}

function copy(){
if(out.textContent) navigator.clipboard.writeText(out.textContent);
}
</script>

</body>
</html>
