<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Merger – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Manrope,system-ui;min-height:100vh;
background:
radial-gradient(circle at 20% 20%,#bbf7d0,transparent 45%),
radial-gradient(circle at 80% 80%,#bfdbfe,transparent 45%),
linear-gradient(135deg,#fdf4ff,#ecfeff);
display:flex;align-items:center;justify-content:center;color:#111;
}
.home-btn{
position:fixed;top:16px;left:16px;
padding:8px 14px;border-radius:999px;background:#fff;
text-decoration:none;color:#111;font-weight:700;font-size:13px;
box-shadow:0 10px 26px rgba(0,0,0,.12);z-index:50;
}
.card{
width:1000px;max-width:95%;background:#fff;border-radius:34px;
padding:30px;box-shadow:0 30px 70px rgba(0,0,0,.18);
}
h1{margin:0;font-size:28px}
.meta{margin-top:6px;font-size:13px;color:#555}

.upload{
margin-top:24px;border:2px dashed #c7d2fe;border-radius:26px;
padding:28px;text-align:center;
background:linear-gradient(135deg,#eef2ff,#f0fdf4);
}
.upload input{display:none}
.upload label{
display:inline-block;padding:14px 22px;border-radius:20px;
background:#fff;cursor:pointer;font-weight:800;
box-shadow:0 12px 30px rgba(0,0,0,.12)
}

.list{
margin-top:18px;display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;
}
.item{position:relative;background:#000;border-radius:18px;overflow:hidden}
.item video{width:100%;height:140px;object-fit:cover}
.cut{
position:absolute;top:8px;right:8px;width:32px;height:32px;
border-radius:50%;border:none;cursor:pointer;
background:#ef4444;color:#fff;font-weight:900;
}

.controls{margin-top:22px;display:flex;gap:14px}
button{
padding:14px 18px;border-radius:18px;border:none;
font-weight:800;cursor:pointer;color:#fff;
background:linear-gradient(135deg,#6366f1,#22c55e);
}

.result{display:none;margin-top:26px}
.result video{width:100%;border-radius:22px}
.download{
display:inline-block;margin-top:14px;padding:14px 22px;
border-radius:18px;font-weight:800;color:#fff;text-decoration:none;
background:linear-gradient(135deg,#22c55e,#3b82f6);
}

.note{
margin-top:14px;font-size:12px;color:#666;
}

.toast{
position:fixed;bottom:30px;left:50%;
transform:translateX(-50%) translateY(20px);
background:#111;color:#fff;padding:12px 20px;
border-radius:999px;font-size:14px;font-weight:800;
opacity:0;pointer-events:none;transition:.3s ease;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.overlay{
position:fixed;inset:0;background:rgba(255,255,255,.88);
backdrop-filter:blur(8px);display:none;
align-items:center;justify-content:center;z-index:100;
}
.overlay.active{display:flex}
.overlay-box{
background:#fff;padding:30px 36px;border-radius:24px;
box-shadow:0 30px 70px rgba(0,0,0,.2);
text-align:center;font-weight:800;
}
.spinner{
margin:16px auto 0;width:36px;height:36px;
border:4px solid #e5e7eb;border-top-color:#6366f1;
border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.small{font-size:12px;color:#555;margin-top:8px}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="toast" id="toast">Please add at least 2 videos</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div id="funText">Processing videos…</div>
    <div class="spinner"></div>
    <div class="small">Please wait, do not close this tab</div>
  </div>
</div>

<div class="card">
<h1>Video Merger</h1>
<div class="meta">Merge videos • Preview • Download</div>

<div class="upload">
  <input type="file" id="videoInput" accept="video/*" multiple>
  <label for="videoInput">➕ Tap to add videos</label>
</div>

<div class="list" id="list"></div>

<div class="controls">
  <button id="mergeBtn">Merge Videos</button>
</div>

<div class="result" id="result">
  <video id="preview" controls></video>
  <a id="download" class="download" download>⬇ Download merged video</a>
</div>

<div class="note">
<strong>Note:</strong> Videos are processed entirely in your browser.
Audio and video may be re-encoded, which can cause minor quality loss.
</div>
</div>

<script>
const input = document.getElementById("videoInput");
const list = document.getElementById("list");
const mergeBtn = document.getElementById("mergeBtn");
const toast = document.getElementById("toast");
const overlay = document.getElementById("overlay");
const funText = document.getElementById("funText");
const result = document.getElementById("result");
const preview = document.getElementById("preview");
const download = document.getElementById("download");

let files = [];
const funLines = [
  "Processing videos…",
  "Combining audio & video…",
  "Almost done…",
  "Finalizing output…"
];

function showToast(){
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2500);
}

input.addEventListener("change",()=>{
  [...input.files].forEach(file=>{
    files.push(file);
    const div=document.createElement("div");
    div.className="item";

    const v=document.createElement("video");
    v.src=URL.createObjectURL(file);
    v.controls=true;

    const cut=document.createElement("button");
    cut.className="cut";
    cut.textContent="✕";
    cut.onclick=()=>{
      files=files.filter(f=>f!==file);
      div.remove();
    };

    div.appendChild(v);
    div.appendChild(cut);
    list.appendChild(div);
  });
  input.value="";
});

mergeBtn.onclick = async ()=>{
  if(files.length<2){ showToast(); return; }

  overlay.classList.add("active");
  let i=0;
  const t=setInterval(()=>{
    funText.textContent = funLines[i++ % funLines.length];
  },1200);

  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");

  const audioCtx=new AudioContext();
  const dest=audioCtx.createMediaStreamDestination();

  const videoStream=canvas.captureStream();
  const combinedStream=new MediaStream([
    ...videoStream.getVideoTracks(),
    ...dest.stream.getAudioTracks()
  ]);

  const recorder=new MediaRecorder(combinedStream);
  const chunks=[];
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.start();

  for(const file of files){
    const video=document.createElement("video");
    video.src=URL.createObjectURL(file);

    const src=audioCtx.createMediaElementSource(video);
    src.connect(dest);
    src.connect(audioCtx.destination);

    await video.play();

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    while(!video.ended){
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      await new Promise(r=>requestAnimationFrame(r));
    }
  }

  recorder.stop();
  recorder.onstop=()=>{
    clearInterval(t);
    overlay.classList.remove("active");
    const blob=new Blob(chunks,{type:"video/webm"});
    const url=URL.createObjectURL(blob);
    preview.src=url;
    download.href=url;
    download.download="merged-video.webm";
    result.style.display="block";
  };
};
</script>

</body>
</html>
