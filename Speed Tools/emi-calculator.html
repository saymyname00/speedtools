<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EMI Calculator – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Manrope,system-ui;
min-height:100vh;
background:
radial-gradient(circle at 20% 20%,#bbf7d0,transparent 40%),
radial-gradient(circle at 80% 80%,#bfdbfe,transparent 45%),
linear-gradient(135deg,#fdf4ff,#ecfeff);
display:flex;
align-items:center;
justify-content:center;
}

/* HOME */
.home-btn{
position:fixed;
top:16px;left:16px;
padding:8px 14px;
border-radius:999px;
background:#fff;
text-decoration:none;
color:#111;
font-weight:700;
font-size:13px;
box-shadow:0 10px 26px rgba(0,0,0,.12);
}

/* CARD */
.card{
width:900px;
max-width:95%;
background:linear-gradient(135deg,#ffffff,#f8fafc);
border-radius:32px;
padding:28px;
box-shadow:0 30px 70px rgba(0,0,0,.18);
}

/* HEADER */
.header h1{
margin:0;
font-size:30px;
font-weight:800;
}
.meta{
margin-top:6px;
font-size:13px;
color:#555;
}

/* GRID */
.grid{
margin-top:26px;
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
}

/* INPUTS */
.group label{
font-size:13px;
font-weight:700;
color:#333;
}
.group input, .group select{
margin-top:6px;
width:100%;
padding:14px 16px;
border-radius:16px;
border:1px solid #ddd;
font-size:15px;
font-family:Manrope;
outline:none;
background:#fff;
}
.group input:focus{
border-color:#6366f1;
box-shadow:0 0 0 3px rgba(99,102,241,.15);
}

/* RESULT BOX */
.result{
background:linear-gradient(135deg,#7c3aed,#22c55e);
border-radius:24px;
padding:22px;
color:#fff;
display:flex;
flex-direction:column;
justify-content:center;
gap:14px;
}

.result div{
font-size:14px;
opacity:.95;
}
.result strong{
display:block;
font-size:26px;
}

/* FOOTER */
.footer{
margin-top:18px;
font-size:12px;
color:#666;
text-align:center;
}

/* MOBILE */
@media(max-width:800px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
  <h1>EMI Calculator</h1>
  <div class="meta">Instant EMI • Browser-based • No login • Privacy-first</div>
</div>

<div class="grid">

<!-- INPUTS -->
<div>
  <div class="group">
    <label>Loan Amount (₹)</label>
    <input type="number" id="amount" placeholder="e.g. 500000">
  </div>

  <div class="group" style="margin-top:16px">
    <label>Interest Rate (% per year)</label>
    <input type="number" step="0.01" id="rate" placeholder="e.g. 8.5">
  </div>

  <div class="group" style="margin-top:16px">
    <label>Loan Tenure</label>
    <select id="tenureType">
      <option value="year">Years</option>
      <option value="month">Months</option>
    </select>
    <input type="number" id="tenure" placeholder="e.g. 5" style="margin-top:8px">
  </div>
</div>

<!-- RESULTS -->
<div class="result">
  <div>
    Monthly EMI
    <strong id="emi">₹0</strong>
  </div>
  <div>
    Total Interest
    <strong id="interest">₹0</strong>
  </div>
  <div>
    Total Payable
    <strong id="total">₹0</strong>
  </div>
</div>

</div>

<div class="footer">
All calculations happen in your browser. Results are approximate.
</div>

</div>

<script>
const amount=document.getElementById("amount");
const rate=document.getElementById("rate");
const tenure=document.getElementById("tenure");
const tenureType=document.getElementById("tenureType");

const emiEl=document.getElementById("emi");
const interestEl=document.getElementById("interest");
const totalEl=document.getElementById("total");

function calculateEMI(){
const P=parseFloat(amount.value);
const R=parseFloat(rate.value);
let N=parseFloat(tenure.value);

if(!P || !R || !N){
emiEl.textContent="₹0";
interestEl.textContent="₹0";
totalEl.textContent="₹0";
return;
}

if(tenureType.value==="year") N=N*12;

const monthlyRate=R/12/100;
const emi=P*monthlyRate*Math.pow(1+monthlyRate,N)/(Math.pow(1+monthlyRate,N)-1);
const total=emi*N;
const interest=total-P;

emiEl.textContent="₹"+emi.toFixed(0);
interestEl.textContent="₹"+interest.toFixed(0);
totalEl.textContent="₹"+total.toFixed(0);
}

document.querySelectorAll("input, select").forEach(el=>{
el.addEventListener("input",calculateEMI);
});
</script>

</body>
</html>
