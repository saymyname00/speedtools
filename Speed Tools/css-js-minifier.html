<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS & JS Minifier – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 18% 22%,#fde68a,transparent 40%),
radial-gradient(circle at 82% 78%,#bfdbfe,transparent 45%),
linear-gradient(135deg,#fefce8,#eff6ff);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#111;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;
text-decoration:none;font-size:14px;font-weight:600;
padding:8px 14px;border-radius:999px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
color:#111;
box-shadow:0 10px 26px rgba(0,0,0,.12);
transition:.2s;z-index:999;
}
.home-btn:hover{transform:translateY(-1px)}

/* CARD */
.card{
width:95%;max-width:1100px;
background:#fff;padding:26px;
border-radius:26px;
box-shadow:0 28px 60px rgba(0,0,0,.15);
}

/* HEADER */
.header{
display:flex;justify-content:space-between;align-items:center;margin-bottom:8px
}
.header h1{font-size:30px;margin:0}
.badge{
font-size:12px;
background:linear-gradient(135deg,#f59e0b,#6366f1);
color:#fff;
padding:6px 12px;border-radius:999px
}
.subtitle{font-size:14px;color:#555;margin-bottom:14px}

/* TABS */
.tabs{
display:flex;
gap:10px;
margin-bottom:14px;
}
.tab{
flex:1;
text-align:center;
padding:10px;
border-radius:14px;
font-size:14px;
cursor:pointer;
background:#f1f5f9;
font-weight:600;
}
.tab.active{
background:linear-gradient(135deg,#f59e0b,#6366f1);
color:#fff;
box-shadow:0 10px 26px rgba(99,102,241,.35);
}

/* LAYOUT */
.main{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

/* TEXTAREA */
textarea{
width:100%;
height:220px;
padding:18px;
font-size:14px;
border-radius:18px;
border:1px solid #ddd;
resize:none;
outline:none;
font-family:Inter;
background:#f9fafb;
}
textarea:focus{
border-color:#6366f1;
box-shadow:0 0 0 3px rgba(99,102,241,.15);
background:#fff;
}

/* ACTIONS */
.actions{
display:flex;
gap:12px;
margin-top:12px;
}
button{
flex:1;
padding:13px;
border-radius:16px;
border:none;
font-size:14px;
font-family:Inter;
cursor:pointer;
transition:.15s;
}
button:active{transform:scale(.96)}
.minify{
background:linear-gradient(135deg,#22c55e,#4ade80);
color:#052e16;
box-shadow:0 10px 30px rgba(34,197,94,.4)
}
.copy{background:#e5e7eb}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:12px;
}
.stat{
background:linear-gradient(135deg,#fefce8,#eff6ff);
padding:12px;
border-radius:14px;
text-align:center;
font-size:13px;
box-shadow:0 6px 14px rgba(0,0,0,.08);
}
.stat strong{display:block;font-size:20px}

/* FOOTER */
.footer{
margin-top:12px;
text-align:center;
font-size:12px;
color:#666
}

/* MOBILE */
@media(max-width:900px){
.main{grid-template-columns:1fr}
textarea{height:190px}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
<h1>CSS / JS Minifier</h1>
<div class="badge">Developer Tool</div>
</div>

<p class="subtitle">
Minify CSS or JavaScript code instantly. No server, no tracking.
</p>

<div class="tabs">
<div class="tab active" id="cssTab" onclick="switchMode('css')">CSS</div>
<div class="tab" id="jsTab" onclick="switchMode('js')">JavaScript</div>
</div>

<div class="main">

<textarea id="input" placeholder="Paste your code here..."></textarea>

<textarea id="output" placeholder="Minified code will appear here..." readonly></textarea>

</div>

<div class="actions">
<button class="minify" onclick="minifyCode()">Minify</button>
<button class="copy" onclick="copyResult()">Copy</button>
</div>

<div class="stats">
<div class="stat"><strong id="inLen">0</strong>Input Size</div>
<div class="stat"><strong id="outLen">0</strong>Output Size</div>
<div class="stat"><strong id="saved">0%</strong>Saved</div>
</div>

<div class="footer">
✂️ Minify code • 🔒 Private • 🚫 No login • Browser based
</div>

</div>

<script>
let mode="css";

const input=document.getElementById("input");
const output=document.getElementById("output");
const inLen=document.getElementById("inLen");
const outLen=document.getElementById("outLen");
const saved=document.getElementById("saved");

function switchMode(m){
mode=m;
document.getElementById("cssTab").classList.toggle("active",m==="css");
document.getElementById("jsTab").classList.toggle("active",m==="js");
input.placeholder=m==="css"
?"Paste CSS code here..."
:"Paste JavaScript code here...";
clearAll();
}

input.addEventListener("input",()=>{
inLen.textContent=input.value.length;
});

function minifyCode(){
let code=input.value;
if(!code) return;

if(mode==="css"){
code=code
.replace(/\/\*[\s\S]*?\*\//g,"")
.replace(/\s+/g," ")
.replace(/\s*([{}:;,])\s*/g,"$1")
.replace(/;}/g,"}");
}else{
code=code
.replace(/\/\/.*$/gm,"")
.replace(/\/\*[\s\S]*?\*\//g,"")
.replace(/\s+/g," ")
.replace(/\s*([=;:{}(),<>+\-*\/])\s*/g,"$1");
}

output.value=code.trim();
outLen.textContent=output.value.length;
saved.textContent=
inLen.textContent>0
? Math.round((1-output.value.length/inLen.textContent)*100)+"%"
: "0%";
}

function copyResult(){
if(output.value) navigator.clipboard.writeText(output.value);
}

function clearAll(){
input.value="";
output.value="";
inLen.textContent=0;
outLen.textContent=0;
saved.textContent="0%";
}
</script>

</body>
</html>
