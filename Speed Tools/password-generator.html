<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Generator – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 20% 20%,#fca5a5,transparent 40%),
radial-gradient(circle at 80% 80%,#93c5fd,transparent 45%),
linear-gradient(135deg,#0f172a,#020617);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#e5e7eb;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;
text-decoration:none;font-size:14px;font-weight:600;
padding:8px 14px;border-radius:999px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(12px);
color:#fff;
box-shadow:0 10px 26px rgba(0,0,0,.5);
transition:.2s;z-index:999;
}
.home-btn:hover{transform:translateY(-1px)}

/* CARD */
.card{
width:95%;max-width:900px;
background:rgba(15,23,42,.92);
padding:28px;border-radius:24px;
box-shadow:0 30px 70px rgba(0,0,0,.6);
border:1px solid rgba(255,255,255,.08);
}

.header{
display:flex;justify-content:space-between;align-items:center;margin-bottom:8px
}
.header h1{font-size:30px;margin:0}
.badge{
font-size:12px;
background:linear-gradient(135deg,#facc15,#f97316);
color:#1c1917;
padding:6px 12px;border-radius:999px
}
.subtitle{font-size:14px;color:#94a3b8;margin-bottom:14px}

/* OUTPUT */
.output{
display:flex;gap:10px;margin-bottom:10px
}
.output input{
flex:1;padding:14px;border-radius:14px;
border:none;font-size:16px;
background:#020617;color:#e5e7eb;
outline:none;
}
.output button{
padding:14px 18px;border-radius:14px;border:none;
cursor:pointer;font-size:14px;
font-family:Inter;
background:linear-gradient(135deg,#6366f1,#8b5cf6);
color:#fff;
box-shadow:0 10px 30px rgba(99,102,241,.45);
}

/* STRENGTH */
.strength{
margin-bottom:14px;
}
.strength-bar{
height:8px;border-radius:999px;
background:#1e293b;
overflow:hidden;
}
.strength-fill{
height:100%;width:0%;
transition:.3s;
}
.strength-text{
margin-top:6px;font-size:13px;
font-weight:600;
}

/* GRID */
.grid{
display:grid;grid-template-columns:1fr 1fr;gap:14px
}

/* BOX */
.box{
background:#020617;
padding:16px;border-radius:18px;
border:1px solid rgba(255,255,255,.08)
}
.box label{
font-size:13px;color:#94a3b8;
display:flex;justify-content:space-between;margin-bottom:6px
}
.box input[type=range]{width:100%}

/* CHECKS */
.checks label{
display:flex;align-items:center;gap:8px;
font-size:14px;color:#e5e7eb;
margin-bottom:8px;cursor:pointer
}
.checks input{accent-color:#6366f1}

/* ACTION */
.actions{
margin-top:14px;display:flex;gap:12px
}
.generate{
flex:1;padding:14px;border-radius:16px;border:none;
font-size:15px;font-family:Inter;
cursor:pointer;
background:linear-gradient(135deg,#22c55e,#4ade80);
color:#022c22;
box-shadow:0 10px 30px rgba(34,197,94,.45)
}

.footer{
margin-top:12px;text-align:center;
font-size:12px;color:#64748b
}

/* MOBILE */
@media(max-width:800px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
<h1>Password Generator</h1>
<div class="badge">Premium Security</div>
</div>

<p class="subtitle">
Create ultra-secure passwords. Strength checked instantly.
</p>

<div class="output">
<input id="result" readonly placeholder="Your secure password">
<button onclick="copy()">Copy</button>
</div>

<div class="strength">
<div class="strength-bar">
<div class="strength-fill" id="strengthFill"></div>
</div>
<div class="strength-text" id="strengthText">Strength: —</div>
</div>

<div class="grid">

<div class="box">
<label>
<span>Password Length</span>
<span id="lenLabel">16</span>
</label>
<input type="range" id="length" min="6" max="32" value="16">
</div>

<div class="box checks">
<label><input type="checkbox" id="upper" checked> Uppercase (A-Z)</label>
<label><input type="checkbox" id="lower" checked> Lowercase (a-z)</label>
<label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
<label><input type="checkbox" id="symbols" checked> Symbols (!@#)</label>
</div>

</div>

<div class="actions">
<button class="generate" onclick="generate()">Generate Password</button>
</div>

<div class="footer">
🔒 Strength meter • 🚫 No data saved • ⚡ Instant
</div>

</div>

<script>
const length=document.getElementById("length");
const lenLabel=document.getElementById("lenLabel");
const result=document.getElementById("result");
const strengthFill=document.getElementById("strengthFill");
const strengthText=document.getElementById("strengthText");

length.addEventListener("input",()=>lenLabel.textContent=length.value);

function generate(){
let chars="";
if(upper.checked) chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
if(lower.checked) chars+="abcdefghijklmnopqrstuvwxyz";
if(numbers.checked) chars+="0123456789";
if(symbols.checked) chars+="!@#$%^&*()_+{}[]<>?";

if(!chars) return alert("Select at least one option");

let pass="";
for(let i=0;i<length.value;i++){
pass+=chars[Math.floor(Math.random()*chars.length)];
}
result.value=pass;
checkStrength(pass);
}

function checkStrength(p){
let score=0;
if(p.length>=8) score++;
if(p.length>=12) score++;
if(/[A-Z]/.test(p)) score++;
if(/[a-z]/.test(p)) score++;
if(/[0-9]/.test(p)) score++;
if(/[^A-Za-z0-9]/.test(p)) score++;

if(score<=3){
strengthFill.style.width="33%";
strengthFill.style.background="#ef4444";
strengthText.textContent="Strength: Weak";
}
else if(score<=5){
strengthFill.style.width="66%";
strengthFill.style.background="#facc15";
strengthText.textContent="Strength: Strong";
}
else{
strengthFill.style.width="100%";
strengthFill.style.background="#22c55e";
strengthText.textContent="Strength: Ultra Strong 🔥";
}
}

function copy(){
if(!result.value) return;
navigator.clipboard.writeText(result.value);
}
</script>

</body>
</html>
