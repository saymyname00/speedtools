<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HTML Formatter / Minifier – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 18% 22%,#fbcfe8,transparent 40%),
radial-gradient(circle at 82% 78%,#bbf7d0,transparent 45%),
linear-gradient(135deg,#fdf2f8,#ecfeff);
min-height:100vh;
display:flex;align-items:center;justify-content:center;color:#111;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;
text-decoration:none;font-size:14px;font-weight:600;
padding:8px 14px;border-radius:999px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
color:#111;
box-shadow:0 10px 26px rgba(0,0,0,.12);
transition:.2s;z-index:999;
}
.home-btn:hover{transform:translateY(-1px)}

/* CARD */
.card{
width:95%;max-width:1100px;
background:#fff;padding:26px;
border-radius:26px;
box-shadow:0 28px 60px rgba(0,0,0,.15);
}

/* HEADER */
.header{
display:flex;justify-content:space-between;align-items:center;margin-bottom:8px
}
.header h1{font-size:30px;margin:0}
.badge{
font-size:12px;
background:linear-gradient(135deg,#ec4899,#22c55e);
color:#fff;padding:6px 12px;border-radius:999px
}
.subtitle{font-size:14px;color:#555;margin-bottom:14px}

/* GRID */
.main{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

/* TEXTAREA */
textarea{
width:100%;
height:220px;
padding:18px;
font-size:14px;
border-radius:18px;
border:1px solid #ddd;
resize:none;
outline:none;
font-family:Inter;
background:#f9fafb;
}
textarea:focus{
border-color:#ec4899;
box-shadow:0 0 0 3px rgba(236,72,153,.15);
background:#fff;
}

/* ACTIONS */
.actions{
display:flex;
gap:12px;
margin-top:12px;
}
button{
flex:1;
padding:13px;
border-radius:16px;
border:none;
font-size:14px;
font-family:Inter;
cursor:pointer;
transition:.15s;
}
button:active{transform:scale(.96)}
.format{
background:linear-gradient(135deg,#ec4899,#8b5cf6);
color:#fff;
box-shadow:0 10px 30px rgba(139,92,246,.45)
}
.minify{
background:linear-gradient(135deg,#22c55e,#4ade80);
color:#052e16;
box-shadow:0 10px 30px rgba(34,197,94,.4)
}
.copy{background:#e5e7eb}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:12px;
}
.stat{
background:linear-gradient(135deg,#fdf2f8,#eff6ff);
padding:12px;
border-radius:14px;
text-align:center;
font-size:13px;
box-shadow:0 6px 14px rgba(0,0,0,.08);
}
.stat strong{display:block;font-size:20px}

/* FOOTER */
.footer{
margin-top:12px;
text-align:center;
font-size:12px;
color:#666
}

/* MOBILE */
@media(max-width:900px){
.main{grid-template-columns:1fr}
textarea{height:190px}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
<h1>HTML Formatter / Minifier</h1>
<div class="badge">Developer Tool</div>
</div>

<p class="subtitle">
Format or minify HTML code instantly. Clean structure or compact output.
</p>

<div class="main">

<textarea id="input" placeholder="Paste your HTML code here..."></textarea>

<textarea id="output" placeholder="Formatted or minified HTML will appear here..." readonly></textarea>

</div>

<div class="actions">
<button class="format" onclick="formatHTML()">Format</button>
<button class="minify" onclick="minifyHTML()">Minify</button>
<button class="copy" onclick="copyResult()">Copy</button>
</div>

<div class="stats">
<div class="stat"><strong id="inLen">0</strong>Input Size</div>
<div class="stat"><strong id="outLen">0</strong>Output Size</div>
<div class="stat"><strong id="saved">0%</strong>Saved</div>
</div>

<div class="footer">
🧱 HTML format & minify • 🔒 Private • 🚫 No login • Browser based
</div>

</div>

<script>
const input=document.getElementById("input");
const output=document.getElementById("output");
const inLen=document.getElementById("inLen");
const outLen=document.getElementById("outLen");
const saved=document.getElementById("saved");

input.addEventListener("input",()=>{
inLen.textContent=input.value.length;
});

function formatHTML(){
let html=input.value;
if(!html) return;
html=html
.replace(/></g,">\n<")
.replace(/\n\s*\n/g,"\n")
.replace(/^\s+/gm,"");
output.value=html.trim();
updateStats();
}

function minifyHTML(){
let html=input.value;
if(!html) return;
html=html
.replace(/<!--[\s\S]*?-->/g,"")
.replace(/\n+/g,"")
.replace(/\s{2,}/g," ")
.replace(/>\s+</g,"><")
.trim();
output.value=html;
updateStats();
}

function updateStats(){
outLen.textContent=output.value.length;
saved.textContent=
inLen.textContent>0
? Math.round((1-output.value.length/inLen.textContent)*100)+"%"
: "0%";
}

function copyResult(){
if(output.value) navigator.clipboard.writeText(output.value);
}
</script>

</body>
</html>
