<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF Compressor – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Inter,system-ui;color:#111;
background:
radial-gradient(circle at 20% 20%,#bbf7d0,transparent 40%),
radial-gradient(circle at 80% 80%,#bae6fd,transparent 45%),
linear-gradient(135deg,#ecfeff,#f0fdf4);
min-height:100vh;display:flex;justify-content:center;
}

.home-btn{
position:fixed;top:18px;left:18px;
padding:10px 16px;border-radius:999px;
background:#fff;text-decoration:none;color:#111;
font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.12);
}

.card{
margin:90px auto 50px;width:95%;max-width:900px;
background:#fff;padding:60px;border-radius:36px;
box-shadow:0 40px 90px rgba(0,0,0,.18);text-align:center;
}

h1{margin:0;font-size:36px}
.subtitle{margin:18px 0 36px;font-size:15px;color:#555;line-height:1.9}

.upload{
margin:0 auto 26px;max-width:520px;height:96px;
display:flex;align-items:center;justify-content:center;
border:2px dashed #16a34a;border-radius:18px;
background:#f0fdf4;font-size:16px;font-weight:600;
color:#065f46;cursor:pointer;position:relative;
}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}

.file{
max-width:520px;margin:0 auto 22px;
background:#f8fafc;border-radius:18px;
padding:16px 20px;text-align:left;
box-shadow:0 8px 18px rgba(0,0,0,.08);
display:none;
}

.controls{
max-width:520px;margin:0 auto 10px;text-align:left;
}
.controls label{font-size:14px;display:block;margin-bottom:8px}
.controls input{width:100%}

.warning{
max-width:520px;
margin:8px auto 26px;
font-size:13px;
color:#666;
text-align:left;
}

.main-btn{
margin-top:30px;padding:18px 60px;border-radius:36px;
border:none;font-size:16px;font-weight:600;cursor:pointer;
background:linear-gradient(135deg,#22c55e,#15803d);
color:#fff;box-shadow:0 20px 44px rgba(34,197,94,.5);
}

.result{
margin-top:30px;font-size:14px;line-height:1.9;
display:none;
}

.footer{margin-top:44px;font-size:13px;color:#666}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<h1>PDF Compressor</h1>
<p class="subtitle">
<strong>Force compression mode.</strong><br>
Maximum size reduction with acceptable quality loss.
</p>

<div class="upload">
📄 Tap to select PDF
<input type="file" id="pdfInput" accept="application/pdf">
</div>

<div class="file" id="fileInfo"></div>

<div class="controls">
<label>
Compression strength:
<strong><span id="label">Balanced</span></strong>
</label>
<input type="range" min="1" max="3" value="2" id="strength">
</div>

<div class="warning">
⚠️ Strong compression may reduce visual quality. Use responsibly.
</div>

<button class="main-btn" onclick="compressPDF()">Compress PDF</button>

<div class="result" id="result"></div>

<div class="footer">
💣 Force Compression • 🔒 Private • 🚫 No upload • Browser-based
</div>

</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const input=document.getElementById("pdfInput");
const info=document.getElementById("fileInfo");
const result=document.getElementById("result");
const slider=document.getElementById("strength");
const label=document.getElementById("label");

let file=null;

slider.oninput=()=>{
label.textContent =
slider.value==1?"Light":
slider.value==2?"Balanced":"Strong";
};

input.onchange=()=>{
file=input.files[0];
if(!file) return;
info.style.display="block";
info.innerHTML=`<strong>${file.name}</strong><br>
Original size: ${(file.size/1024).toFixed(1)} KB`;
result.style.display="none";
};

function settings(level){
if(level==1) return {scale:0.95,quality:0.65};
if(level==2) return {scale:0.8,quality:0.45};
return {scale:0.65,quality:0.3};
}

async function compressPDF(){
if(!file){alert("Select a PDF first");return;}

const before=file.size;
const {scale,quality}=settings(slider.value);

const bytes=await file.arrayBuffer();
const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
const out=await PDFLib.PDFDocument.create();

for(let i=1;i<=pdf.numPages;i++){
const page=await pdf.getPage(i);
const viewport=page.getViewport({scale});

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");
canvas.width=viewport.width;
canvas.height=viewport.height;

await page.render({canvasContext:ctx,viewport}).promise;

const blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",quality));
const imgBytes=await blob.arrayBuffer();
const img=await out.embedJpg(imgBytes);

const p=out.addPage([img.width,img.height]);
p.drawImage(img,{x:0,y:0,width:img.width,height:img.height});
}

const outBytes=await out.save();
const blob=new Blob([outBytes],{type:"application/pdf"});

result.style.display="block";
result.innerHTML=`
✅ <strong>Compression complete</strong><br>
Before: ${(before/1024).toFixed(1)} KB<br>
After: ${(blob.size/1024).toFixed(1)} KB
`;

const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="compressed.pdf";
a.click();
URL.revokeObjectURL(a.href);
}
</script>

</body>
</html>
