<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text Case Converter – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 20% 20%,#a5f3fc,transparent 40%),
radial-gradient(circle at 80% 80%,#fde68a,transparent 45%),
linear-gradient(135deg,#f0fdfa,#f8fafc);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#111;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;
text-decoration:none;font-size:14px;font-weight:600;
padding:8px 14px;border-radius:999px;
background:rgba(255,255,255,.8);
backdrop-filter:blur(12px);
color:#111;
box-shadow:0 10px 26px rgba(0,0,0,.12);
transition:.2s;z-index:999;
}
.home-btn:hover{transform:translateY(-1px)}

/* CARD */
.card{
width:95%;max-width:1100px;
background:#fff;padding:26px;
border-radius:22px;
box-shadow:0 28px 60px rgba(0,0,0,.14);
}

.header{
display:flex;justify-content:space-between;align-items:center;margin-bottom:8px
}
.header h1{font-size:30px;margin:0}
.badge{
font-size:12px;
background:linear-gradient(135deg,#06b6d4,#22d3ee);
color:#042f2e;
padding:6px 12px;border-radius:999px
}
.subtitle{font-size:14px;color:#555;margin-bottom:14px}

/* LAYOUT */
.main{
display:grid;grid-template-columns:1fr 1fr;gap:18px
}

/* TEXTAREAS */
textarea{
width:100%;height:220px;
padding:18px;font-size:15px;
border-radius:16px;border:1px solid #ddd;
resize:none;outline:none;
font-family:Inter;background:#f8fafc;
}
textarea:focus{
border-color:#06b6d4;
box-shadow:0 0 0 3px rgba(6,182,212,.15);
background:#fff;
}

/* BUTTONS */
.buttons{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:12px;
}
button{
padding:12px;
border-radius:12px;
border:none;
font-size:14px;
font-family:Inter;
cursor:pointer;
transition:.15s;
}
button:active{transform:scale(.96)}

.btn{
background:linear-gradient(135deg,#06b6d4,#22d3ee);
color:#042f2e;
box-shadow:0 8px 22px rgba(6,182,212,.35);
}
.copy{
background:#e5e7eb;
grid-column:span 3;
}

/* FOOTER */
.footer{
margin-top:12px;text-align:center;
font-size:12px;color:#666
}

/* MOBILE */
@media(max-width:900px){
.main{grid-template-columns:1fr}
textarea{height:180px}
.buttons{grid-template-columns:repeat(2,1fr)}
.copy{grid-column:span 2}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
<h1>Text Case Converter</h1>
<div class="badge">Instant</div>
</div>

<p class="subtitle">
Convert text into different letter cases instantly.
</p>

<div class="main">

<textarea id="input" placeholder="Enter your text here..."></textarea>

<textarea id="output" placeholder="Converted text..." readonly></textarea>

</div>

<div class="buttons">
<button class="btn" onclick="toUpper()">UPPERCASE</button>
<button class="btn" onclick="toLower()">lowercase</button>
<button class="btn" onclick="toTitle()">Title Case</button>
<button class="btn" onclick="toSentence()">Sentence case</button>
<button class="btn" onclick="toAlternating()">aLtErNaTiNg</button>
<button class="btn" onclick="clearText()">Clear</button>
<button class="copy" onclick="copy()">Copy Result</button>
</div>

<div class="footer">
⚡ Fast • 🔒 Private • 🚫 No login • Browser based
</div>

</div>

<script>
const input=document.getElementById("input");
const output=document.getElementById("output");

function toUpper(){output.value=input.value.toUpperCase();}
function toLower(){output.value=input.value.toLowerCase();}

function toTitle(){
output.value=input.value.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
}

function toSentence(){
let t=input.value.toLowerCase();
output.value=t.replace(/(^\s*\w|[.!?]\s*\w)/g,c=>c.toUpperCase());
}

function toAlternating(){
let r="";
for(let i=0;i<input.value.length;i++){
r+=i%2?input.value[i].toLowerCase():input.value[i].toUpperCase();
}
output.value=r;
}

function clearText(){
input.value="";
output.value="";
}

function copy(){
if(!output.value) return;
navigator.clipboard.writeText(output.value);
}
</script>

</body>
</html>
