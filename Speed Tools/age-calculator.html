<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Age Calculator – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 20% 20%,#fde68a,transparent 40%),
radial-gradient(circle at 80% 80%,#bbf7d0,transparent 45%),
linear-gradient(135deg,#fefce8,#ecfeff);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#111;
}

/* HOME */
.home-btn{
position:fixed;
top:18px;left:18px;
padding:8px 14px;
border-radius:999px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
text-decoration:none;
color:#111;
font-size:14px;
font-weight:600;
box-shadow:0 10px 26px rgba(0,0,0,.12);
transition:.2s;
z-index:999;
}
.home-btn:hover{transform:translateY(-1px)}

/* CARD */
.card{
width:95%;
max-width:900px;
background:#fff;
padding:28px;
border-radius:28px;
box-shadow:0 30px 70px rgba(0,0,0,.16);
text-align:center;
animation:fadeIn .5s ease;
}
@keyframes fadeIn{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:none}
}

/* HEADER */
h1{margin:0;font-size:32px}
.subtitle{font-size:14px;color:#555;margin:8px 0 20px}

/* DOB INPUTS */
.dob{
display:flex;
gap:12px;
justify-content:center;
flex-wrap:wrap;
}

select,
input[type="number"]{
padding:14px 16px;
border-radius:16px;
border:1px solid #ddd;
font-size:15px;
font-family:Inter;
background:#f9fafb;
outline:none;
min-width:120px;
}

select:focus,
input[type="number"]:focus{
border-color:#22c55e;
box-shadow:0 0 0 3px rgba(34,197,94,.15);
background:#fff;
}

/* BUTTON */
button{
margin-top:18px;
padding:14px 28px;
border-radius:20px;
border:none;
font-size:15px;
font-weight:600;
font-family:Inter;
cursor:pointer;
background:linear-gradient(135deg,#22c55e,#4ade80);
color:#052e16;
box-shadow:0 14px 32px rgba(34,197,94,.4);
transition:.15s;
}
button:active{transform:scale(.96)}

/* RESULT */
.result{
margin-top:26px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
animation:pop .4s ease;
}
@keyframes pop{
from{transform:scale(.95);opacity:0}
to{transform:scale(1);opacity:1}
}

.box{
background:linear-gradient(135deg,#f0fdf4,#ecfeff);
padding:20px;
border-radius:20px;
box-shadow:0 8px 18px rgba(0,0,0,.08);
}
.box strong{
display:block;
font-size:30px;
margin-bottom:4px;
}

/* DETAILS (FIXED & PREMIUM) */
.details{
margin-top:20px;
background:linear-gradient(135deg,#fff7ed,#ecfeff);
padding:20px;
border-radius:20px;
box-shadow:0 8px 18px rgba(0,0,0,.08);
font-size:16px;
color:#333;
line-height:1.7;
animation:fadeIn .4s ease;
}
.details strong{
font-size:20px;
color:#111;
}

/* FOOTER */
.footer{
margin-top:20px;
font-size:12px;
color:#666;
}

/* MOBILE */
@media(max-width:700px){
.result{grid-template-columns:1fr}
select,input[type="number"]{min-width:100%}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<h1>Age Calculator</h1>
<p class="subtitle">
Enter your date of birth and get detailed age information.
</p>

<div class="dob">
<select id="day">
  <option value="">Day</option>
</select>

<select id="month">
  <option value="">Month</option>
</select>

<input type="number" id="year" placeholder="Year" min="1900" max="2100">
</div>

<button onclick="calculate()">Calculate Age</button>

<div class="result" id="result" style="display:none">
  <div class="box"><strong id="years">0</strong>Years</div>
  <div class="box"><strong id="months">0</strong>Months</div>
  <div class="box"><strong id="days">0</strong>Days</div>
</div>

<div class="details" id="details" style="display:none"></div>

<div class="footer">
🎂 Age details • 🔒 Private • 🚫 No login • Browser based
</div>

</div>

<script>
const daySel=document.getElementById("day");
const monthSel=document.getElementById("month");
const yearInput=document.getElementById("year");

/* Populate day & month */
for(let d=1;d<=31;d++){
daySel.innerHTML+=`<option value="${d}">${d}</option>`;
}

["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
.forEach((m,i)=>{
monthSel.innerHTML+=`<option value="${i}">${m}</option>`;
});

function calculate(){
const d=+daySel.value;
const m=+monthSel.value;
const y=+yearInput.value;

if(!d || monthSel.value==="" || !y) return;

const birth=new Date(y,m,d);
const today=new Date();

let years=today.getFullYear()-birth.getFullYear();
let months=today.getMonth()-birth.getMonth();
let days=today.getDate()-birth.getDate();

if(days<0){
months--;
days+=new Date(today.getFullYear(),today.getMonth(),0).getDate();
}
if(months<0){
years--;
months+=12;
}

document.getElementById("years").textContent=years;
document.getElementById("months").textContent=months;
document.getElementById("days").textContent=days;

document.getElementById("result").style.display="grid";

const totalDays=Math.floor((today-birth)/(1000*60*60*24));
const totalMonths=years*12+months;

const nextBirthday=new Date(today.getFullYear(),m,d);
if(nextBirthday<today) nextBirthday.setFullYear(today.getFullYear()+1);
const daysLeft=Math.ceil((nextBirthday-today)/(1000*60*60*24));

const details=document.getElementById("details");
details.innerHTML=
`
🎉 <strong>You have lived ${totalDays.toLocaleString()} amazing days</strong><br>
📅 That’s about <strong>${totalMonths.toLocaleString()} months</strong> of your life<br>
🎂 Your next birthday is coming in <strong>${daysLeft} days</strong>
`;
details.style.display="block";
}
</script>

</body>
</html>
