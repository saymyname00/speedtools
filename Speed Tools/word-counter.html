<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Counter – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 15% 20%,#c7d2fe,transparent 40%),
radial-gradient(circle at 85% 80%,#fde68a,transparent 45%),
linear-gradient(135deg,#eef2ff,#f8fafc);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#111;
}

/* HOME BUTTON */
.home-btn{
position:fixed;
top:18px;
left:18px;
text-decoration:none;
font-size:14px;
font-weight:600;
padding:8px 14px;
border-radius:999px;
background:rgba(255,255,255,.75);
backdrop-filter:blur(12px);
color:#111;
box-shadow:0 10px 26px rgba(0,0,0,.12);
transition:.2s;
z-index:999;
}
.home-btn:hover{
transform:translateY(-1px);
box-shadow:0 14px 32px rgba(0,0,0,.18);
}

/* CARD */
.card{
width:95%;
max-width:1100px;
background:#fff;
padding:28px;
border-radius:22px;
box-shadow:0 28px 60px rgba(0,0,0,.14);
transition:.25s;
}
.card:hover{transform:translateY(-2px)}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}
.header h1{
font-size:30px;
margin:0;
}
.badge{
font-size:12px;
background:linear-gradient(135deg,#6366f1,#8b5cf6);
color:#fff;
padding:6px 12px;
border-radius:999px;
}

.subtitle{
font-size:14px;
color:#555;
margin-bottom:14px;
}

/* LAYOUT */
.main{
display:grid;
grid-template-columns:1.2fr 1fr;
gap:18px;
}

/* TEXTAREA */
textarea{
width:100%;
height:230px;
padding:18px;
font-size:15px;
border-radius:16px;
border:1px solid #ddd;
resize:none;
outline:none;
font-family:Inter;
background:#fafafa;
transition:.2s;
}
textarea:focus{
border-color:#6366f1;
box-shadow:0 0 0 3px rgba(99,102,241,.15);
background:#fff;
transform:translateY(-1px);
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}
.stat{
background:linear-gradient(135deg,#f8fafc,#eef2ff);
padding:14px;
border-radius:16px;
text-align:center;
box-shadow:0 6px 14px rgba(0,0,0,.08);
transition:.2s;
}
.stat.bump{
transform:scale(1.05);
box-shadow:0 12px 26px rgba(0,0,0,.14);
}
.stat strong{
display:block;
font-size:22px;
margin-bottom:2px;
}

/* ACTIONS */
.actions{
margin-top:14px;
display:flex;
gap:12px;
}
button{
flex:1;
padding:12px;
border-radius:12px;
border:none;
cursor:pointer;
font-size:14px;
font-family:Inter;
transition:.15s;
}
button:hover{filter:brightness(1.05)}
button:active{transform:scale(.96)}

.clear{background:#e5e7eb}
.copy{
background:linear-gradient(135deg,#6366f1,#8b5cf6);
color:#fff;
box-shadow:0 10px 26px rgba(99,102,241,.35);
}

.footer{
margin-top:14px;
text-align:center;
font-size:12px;
color:#666;
}

/* MOBILE */
@media(max-width:900px){
.main{grid-template-columns:1fr}
textarea{height:180px}
}
</style>
</head>

<body>

<!-- HOME BUTTON -->
<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
<h1>Word Counter</h1>
<div class="badge">100% Browser Based</div>
</div>

<p class="subtitle">
Count words, characters, lines & more — instantly, privately.
</p>

<div class="main">

<textarea id="text" placeholder="Start typing or paste your text here..."></textarea>

<div>
<div class="stats">
<div class="stat"><strong id="words">0</strong>Words</div>
<div class="stat"><strong id="chars">0</strong>Characters</div>
<div class="stat"><strong id="charsNo">0</strong>No Spaces</div>
<div class="stat"><strong id="lines">0</strong>Lines</div>
<div class="stat"><strong id="sentences">0</strong>Sentences</div>
<div class="stat"><strong id="paragraphs">0</strong>Paragraphs</div>
</div>

<div class="actions">
<button class="clear" onclick="clearText()">Clear</button>
<button class="copy" onclick="copyText()">Copy</button>
</div>
</div>

</div>

<div class="footer">
⚡ Fast • 🔒 Private • 🚫 No login • Runs in your browser
</div>

</div>

<script>
const text=document.getElementById("text");

const wordsEl=document.getElementById("words");
const charsEl=document.getElementById("chars");
const charsNoEl=document.getElementById("charsNo");
const linesEl=document.getElementById("lines");
const sentencesEl=document.getElementById("sentences");
const paragraphsEl=document.getElementById("paragraphs");

text.addEventListener("input",update);

function bump(el){
el.classList.remove("bump");
void el.offsetWidth;
el.classList.add("bump");
setTimeout(()=>el.classList.remove("bump"),180);
}

function update(){
const v=text.value;

const words=v.trim()?v.trim().split(/\s+/).length:0;
const chars=v.length;
const charsNo=v.replace(/\s/g,"").length;
const lines=v.split(/\n/).length;
const sentences=v.split(/[.!?]+/).filter(s=>s.trim()).length;
const paragraphs=v.split(/\n\s*\n/).filter(p=>p.trim()).length;

wordsEl.textContent=words; bump(wordsEl.parentElement);
charsEl.textContent=chars; bump(charsEl.parentElement);
charsNoEl.textContent=charsNo; bump(charsNoEl.parentElement);
linesEl.textContent=lines; bump(linesEl.parentElement);
sentencesEl.textContent=sentences; bump(sentencesEl.parentElement);
paragraphsEl.textContent=paragraphs; bump(paragraphsEl.parentElement);
}

function clearText(){
text.value="";
update();
}

function copyText(){
navigator.clipboard.writeText(text.value);
}
</script>

</body>
</html>
