<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lorem Ipsum Generator – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Inter,system-ui;
background:
radial-gradient(circle at 20% 20%,#fde68a,transparent 40%),
radial-gradient(circle at 80% 80%,#a7f3d0,transparent 45%),
linear-gradient(135deg,#f8fafc,#ecfeff);
min-height:100vh;display:flex;align-items:center;justify-content:center;color:#111;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;text-decoration:none;font-size:14px;font-weight:600;
padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);color:#111;box-shadow:0 10px 26px rgba(0,0,0,.12);
transition:.2s;z-index:999;
}
.home-btn:hover{transform:translateY(-1px)}

/* CARD */
.card{
width:95%;max-width:1100px;background:#fff;padding:26px;border-radius:26px;
box-shadow:0 28px 60px rgba(0,0,0,.15);
}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.header h1{font-size:30px;margin:0}
.badge{font-size:12px;background:linear-gradient(135deg,#22c55e,#4ade80);
color:#052e16;padding:6px 12px;border-radius:999px}
.subtitle{font-size:14px;color:#555;margin-bottom:14px}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* OUTPUT */
textarea{
width:100%;height:260px;padding:18px;font-size:14px;border-radius:18px;
border:1px solid #ddd;resize:none;outline:none;font-family:Inter;background:#f9fafb;
}
textarea:focus{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15);background:#fff}

/* CONTROLS */
.controls{
display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px
}
.control{
background:#f9fafb;padding:12px;border-radius:14px;border:1px solid #e5e7eb
}
.control label{font-size:12px;color:#555;display:block;margin-bottom:6px}
.control input,.control select{
width:100%;padding:8px;border-radius:10px;border:1px solid #ddd;font-size:13px
}

/* ACTIONS */
.actions{display:flex;gap:12px;margin-top:12px}
button{
flex:1;padding:13px;border-radius:16px;border:none;font-size:14px;font-family:Inter;
cursor:pointer;transition:.15s;
}
button:active{transform:scale(.96)}
.generate{
background:linear-gradient(135deg,#22c55e,#4ade80);color:#052e16;
box-shadow:0 10px 30px rgba(34,197,94,.4)
}
.copy{background:#e5e7eb}
.clear{background:#f1f5f9}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{
background:linear-gradient(135deg,#f0fdf4,#ecfeff);padding:12px;border-radius:14px;
text-align:center;font-size:13px;box-shadow:0 6px 14px rgba(0,0,0,.08)
}
.stat strong{display:block;font-size:20px}

/* FOOTER */
.footer{margin-top:12px;text-align:center;font-size:12px;color:#666}

/* MOBILE */
@media(max-width:900px){
.main{grid-template-columns:1fr}
.controls{grid-template-columns:1fr 1fr}
textarea{height:220px}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">
  <div class="header">
    <h1>Lorem Ipsum Generator</h1>
    <div class="badge">Designer Friendly</div>
  </div>
  <p class="subtitle">Generate placeholder text for layouts, mockups and content.</p>

  <div class="controls">
    <div class="control">
      <label>Type</label>
      <select id="type">
        <option value="paragraphs">Paragraphs</option>
        <option value="sentences">Sentences</option>
        <option value="words">Words</option>
      </select>
    </div>
    <div class="control">
      <label>Count</label>
      <input type="number" id="count" min="1" max="50" value="3">
    </div>
    <div class="control">
      <label>Start with “Lorem ipsum”</label>
      <select id="start">
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>
    <div class="control">
      <label>Line breaks</label>
      <select id="breaks">
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>
  </div>

  <div class="main">
    <textarea id="output" placeholder="Generated lorem ipsum will appear here..." readonly></textarea>
    <div>
      <div class="actions">
        <button class="generate" onclick="generate()">Generate</button>
        <button class="copy" onclick="copyText()">Copy</button>
        <button class="clear" onclick="clearAll()">Clear</button>
      </div>

      <div class="stats">
        <div class="stat"><strong id="words">0</strong>Words</div>
        <div class="stat"><strong id="chars">0</strong>Characters</div>
        <div class="stat"><strong id="paras">0</strong>Paragraphs</div>
      </div>
    </div>
  </div>

  <div class="footer">✍️ Placeholder text • 🔒 Private • 🚫 No login • Browser based</div>
</div>

<script>
const base = "lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua".split(" ");

function makeSentence(){
  const len = Math.floor(Math.random()*8)+8;
  let s=[];
  for(let i=0;i<len;i++) s.push(base[Math.floor(Math.random()*base.length)]);
  let out=s.join(" ");
  return out.charAt(0).toUpperCase()+out.slice(1)+".";
}

function generate(){
  const type=typeSel.value, n=+count.value;
  let out=[];
  if(type==="words"){
    for(let i=0;i<n;i++) out.push(base[i%base.length]);
    out=out.join(" ");
  }
  if(type==="sentences"){
    for(let i=0;i<n;i++) out.push(makeSentence());
    out=out.join(" ");
  }
  if(type==="paragraphs"){
    for(let i=0;i<n;i++){
      let p=[];
      for(let j=0;j<4;j++) p.push(makeSentence());
      out.push(p.join(" "));
    }
    out=breaksSel.value==="yes"?out.join("\n\n"):out.join(" ");
  }
  if(startSel.value==="yes") out="Lorem ipsum "+out;
  output.value=out;
  updateStats(out);
}

function updateStats(t){
  words.textContent=t.trim()?t.trim().split(/\s+/).length:0;
  chars.textContent=t.length;
  paras.textContent=t.split(/\n\n+/).filter(p=>p.trim()).length;
}

function copyText(){ if(output.value) navigator.clipboard.writeText(output.value); }
function clearAll(){ output.value=""; updateStats(""); }

const typeSel=document.getElementById("type");
const count=document.getElementById("count");
const startSel=document.getElementById("start");
const breaksSel=document.getElementById("breaks");
const output=document.getElementById("output");
const words=document.getElementById("words");
const chars=document.getElementById("chars");
const paras=document.getElementById("paras");
</script>

</body>
</html>
