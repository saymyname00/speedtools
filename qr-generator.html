<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Code Generator – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 20% 20%,#fecaca,transparent 40%),
radial-gradient(circle at 80% 80%,#bbf7d0,transparent 45%),
linear-gradient(135deg,#f8fafc,#ecfeff);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#111;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;
text-decoration:none;font-size:14px;font-weight:600;
padding:8px 14px;border-radius:999px;
background:rgba(255,255,255,.75);
backdrop-filter:blur(12px);
color:#111;
box-shadow:0 10px 26px rgba(0,0,0,.12);
transition:.2s;z-index:999;
}
.home-btn:hover{
transform:translateY(-1px);
box-shadow:0 14px 32px rgba(0,0,0,.18);
}

/* CARD */
.card{
width:95%;max-width:1000px;
background:#fff;padding:26px;
border-radius:22px;
box-shadow:0 28px 60px rgba(0,0,0,.14);
}

.header{
display:flex;justify-content:space-between;align-items:center;margin-bottom:8px
}
.header h1{font-size:30px;margin:0}
.badge{
font-size:12px;background:linear-gradient(135deg,#22c55e,#4ade80);
color:#fff;padding:6px 12px;border-radius:999px
}
.subtitle{font-size:14px;color:#555;margin-bottom:14px}

/* LAYOUT */
.main{
display:grid;grid-template-columns:1.2fr 1fr;gap:18px
}

/* INPUT */
textarea{
width:100%;height:190px;
padding:18px;font-size:15px;
border-radius:16px;border:1px solid #ddd;
resize:none;outline:none;
font-family:Inter;background:#f8fafc;
}
textarea:focus{
border-color:#22c55e;
box-shadow:0 0 0 3px rgba(34,197,94,.15);
background:#fff;
}

/* OPTIONS */
.options{
margin-top:12px;
background:#ecfeff;
padding:14px;
border-radius:16px;
}
.options label{
font-size:13px;color:#555;
display:flex;justify-content:space-between;
margin-bottom:6px;
}
.options input[type=range]{width:100%}

/* QR BOX */
.qr-box{
display:flex;align-items:center;justify-content:center;
height:260px;border-radius:18px;
background:linear-gradient(135deg,#f0fdf4,#ecfeff);
box-shadow:0 10px 26px rgba(0,0,0,.12);
}
.qr-placeholder{
font-size:14px;color:#666;text-align:center;
}

/* ACTIONS */
.actions{
margin-top:12px;display:flex;gap:12px
}
button{
flex:1;padding:12px;border-radius:12px;
border:none;font-size:14px;
font-family:Inter;cursor:pointer;
transition:.15s;
}
button:active{transform:scale(.96)}
.generate{
background:linear-gradient(135deg,#22c55e,#4ade80);
color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.35)
}
.download{background:#e5e7eb}
button:disabled{opacity:.6;cursor:not-allowed}

.footer{
margin-top:12px;text-align:center;
font-size:12px;color:#666
}

/* MOBILE */
@media(max-width:900px){
.main{grid-template-columns:1fr}
.qr-box{height:220px}
textarea{height:160px}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
<h1>QR Code Generator</h1>
<div class="badge">100% Browser Based</div>
</div>

<p class="subtitle">
Generate QR codes for text or URLs instantly. No tracking.
</p>

<div class="main">

<div>
<textarea id="qrText" placeholder="Enter text or URL here..."></textarea>

<div class="options">
<label>
<span>QR Size</span>
<span id="sizeLabel">220 px</span>
</label>
<input type="range" id="size" min="160" max="300" value="220">

<label style="margin-top:10px">
<span>QR Color</span>
<span id="colorLabel">#111111</span>
</label>
<input type="color" id="color" value="#111111">
</div>

<div class="actions">
<button class="generate" id="generate">Generate QR</button>
<button class="download" id="download" disabled>Download</button>
</div>
</div>

<div class="qr-box" id="qrBox">
<div class="qr-placeholder">Your QR will appear here</div>
</div>

</div>

<div class="footer">
⚡ Fast • 🔒 Private • 🚫 No login • Runs in your browser
</div>

</div>

<!-- QR LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

<script>
const qrText=document.getElementById("qrText");
const qrBox=document.getElementById("qrBox");
const generateBtn=document.getElementById("generate");
const downloadBtn=document.getElementById("download");
const size=document.getElementById("size");
const sizeLabel=document.getElementById("sizeLabel");
const color=document.getElementById("color");
const colorLabel=document.getElementById("colorLabel");

size.addEventListener("input",()=>{
sizeLabel.textContent=size.value+" px";
});
color.addEventListener("input",()=>{
colorLabel.textContent=color.value;
});

generateBtn.addEventListener("click",()=>{
const text=qrText.value.trim();
if(!text) return;

qrBox.innerHTML="";
const canvas=document.createElement("canvas");
qrBox.appendChild(canvas);

QRCode.toCanvas(canvas,text,{
width:+size.value,
margin:2,
color:{
dark:color.value,
light:"#ffffff"
}
});

downloadBtn.disabled=false;
});

downloadBtn.addEventListener("click",()=>{
const canvas=qrBox.querySelector("canvas");
const a=document.createElement("a");
a.href=canvas.toDataURL("image/png");
a.download="qr-code.png";
a.click();
});
</script>

</body>
</html>
