<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text Cleaner – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Inter,system-ui;
background:
radial-gradient(circle at 18% 22%,#bfdbfe,transparent 40%),
radial-gradient(circle at 82% 78%,#fde68a,transparent 45%),
linear-gradient(135deg,#f8fafc,#ecfeff);
min-height:100vh;display:flex;align-items:center;justify-content:center;color:#111;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;text-decoration:none;font-size:14px;font-weight:600;
padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);color:#111;box-shadow:0 10px 26px rgba(0,0,0,.12);
transition:.2s;z-index:999;
}
.home-btn:hover{transform:translateY(-1px)}

/* CARD */
.card{
width:95%;max-width:1100px;background:#fff;padding:26px;border-radius:26px;
box-shadow:0 28px 60px rgba(0,0,0,.15);
}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.header h1{font-size:30px;margin:0}
.badge{font-size:12px;background:linear-gradient(135deg,#22c55e,#4ade80);
color:#052e16;padding:6px 12px;border-radius:999px}
.subtitle{font-size:14px;color:#555;margin-bottom:14px}

/* LAYOUT */
.main{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* TEXTAREAS */
textarea{
width:100%;height:230px;padding:18px;font-size:14px;border-radius:18px;
border:1px solid #ddd;resize:none;outline:none;font-family:Inter;background:#f9fafb;
}
textarea:focus{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15);background:#fff}

/* OPTIONS */
.options{
display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px
}
.opt{
background:#f9fafb;padding:12px;border-radius:14px;border:1px solid #e5e7eb;
font-size:13px;display:flex;gap:8px;align-items:center
}
.opt input{accent-color:#22c55e}

/* ACTIONS */
.actions{display:flex;gap:12px;margin-top:12px}
button{
flex:1;padding:13px;border-radius:16px;border:none;font-size:14px;font-family:Inter;
cursor:pointer;transition:.15s;
}
button:active{transform:scale(.96)}
.clean{
background:linear-gradient(135deg,#22c55e,#4ade80);color:#052e16;
box-shadow:0 10px 30px rgba(34,197,94,.4)
}
.copy{background:#e5e7eb}
.clear{background:#f1f5f9}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{
background:linear-gradient(135deg,#f0fdf4,#ecfeff);padding:12px;border-radius:14px;
text-align:center;font-size:13px;box-shadow:0 6px 14px rgba(0,0,0,.08)
}
.stat strong{display:block;font-size:20px}

/* FOOTER */
.footer{margin-top:12px;text-align:center;font-size:12px;color:#666}

/* MOBILE */
@media(max-width:900px){
.main{grid-template-columns:1fr}
.options{grid-template-columns:1fr 1fr}
textarea{height:190px}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">
  <div class="header">
    <h1>Text Cleaner</h1>
    <div class="badge">Clean & Fast</div>
  </div>
  <p class="subtitle">Remove extra spaces, tabs and messy line breaks instantly.</p>

  <div class="main">
    <textarea id="input" placeholder="Paste messy text here..."></textarea>
    <textarea id="output" placeholder="Clean text will appear here..." readonly></textarea>
  </div>

  <div class="options">
    <label class="opt"><input type="checkbox" id="trimLines" checked> Trim each line</label>
    <label class="opt"><input type="checkbox" id="multiSpaces" checked> Remove extra spaces</label>
    <label class="opt"><input type="checkbox" id="tabs" checked> Remove tabs</label>
    <label class="opt"><input type="checkbox" id="blankLines" checked> Remove blank lines</label>
  </div>

  <div class="actions">
    <button class="clean" onclick="cleanText()">Clean Text</button>
    <button class="copy" onclick="copyText()">Copy</button>
    <button class="clear" onclick="clearAll()">Clear</button>
  </div>

  <div class="stats">
    <div class="stat"><strong id="lines">0</strong>Lines</div>
    <div class="stat"><strong id="words">0</strong>Words</div>
    <div class="stat"><strong id="chars">0</strong>Characters</div>
  </div>

  <div class="footer">🧼 Clean text • 🔒 Private • 🚫 No login • Browser based</div>
</div>

<script>
const input=document.getElementById("input");
const output=document.getElementById("output");
const linesEl=document.getElementById("lines");
const wordsEl=document.getElementById("words");
const charsEl=document.getElementById("chars");

function cleanText(){
let text=input.value;

if(tabs.checked) text=text.replace(/\t+/g," ");
if(multiSpaces.checked) text=text.replace(/ {2,}/g," ");
let lines=text.split("\n");

lines=lines.map(l=>trimLines.checked?l.trim():l);
if(blankLines.checked) lines=lines.filter(l=>l!=="");

const out=lines.join("\n");
output.value=out;
updateStats(out);
}

function updateStats(t){
linesEl.textContent=t? t.split("\n").length : 0;
wordsEl.textContent=t.trim()? t.trim().split(/\s+/).length : 0;
charsEl.textContent=t.length;
}

function copyText(){ if(output.value) navigator.clipboard.writeText(output.value); }
function clearAll(){ input.value=""; output.value=""; updateStats(""); }
</script>

</body>
</html>
