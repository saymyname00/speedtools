<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Currency Converter – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Manrope,system-ui;
min-height:100vh;
background:
radial-gradient(circle at 20% 20%,#fde68a,transparent 40%),
radial-gradient(circle at 80% 80%,#bfdbfe,transparent 45%),
linear-gradient(135deg,#fdf4ff,#ecfeff);
display:flex;
align-items:center;
justify-content:center;
}

/* HOME */
.home-btn{
position:fixed;
top:16px;left:16px;
padding:8px 14px;
border-radius:999px;
background:#fff;
text-decoration:none;
color:#111;
font-weight:700;
font-size:13px;
box-shadow:0 10px 26px rgba(0,0,0,.12);
}

/* CARD */
.card{
width:900px;
max-width:95%;
background:linear-gradient(135deg,#ffffff,#f8fafc);
border-radius:32px;
padding:28px;
box-shadow:0 30px 70px rgba(0,0,0,.18);
}

/* HEADER */
.header h1{
margin:0;
font-size:28px;
}
.meta{
margin-top:6px;
font-size:13px;
color:#555;
}

/* GRID */
.grid{
margin-top:26px;
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
}

/* INPUT */
.group label{
font-size:13px;
font-weight:700;
color:#333;
}
.group input,.group select{
margin-top:6px;
width:100%;
padding:14px 16px;
border-radius:16px;
border:1px solid #ddd;
font-size:15px;
font-family:Manrope;
outline:none;
background:#fff;
}
.group input:focus,.group select:focus{
border-color:#6366f1;
box-shadow:0 0 0 3px rgba(99,102,241,.15);
}

/* RESULT */
.result{
margin-top:22px;
background:linear-gradient(135deg,#7c3aed,#22c55e);
border-radius:24px;
padding:22px;
color:#fff;
text-align:center;
min-height:120px;
display:flex;
flex-direction:column;
justify-content:center;
}
.result strong{
display:block;
font-size:34px;
margin-top:6px;
}

/* FOOTER */
.footer{
margin-top:16px;
font-size:12px;
color:#666;
text-align:center;
}

/* MOBILE */
@media(max-width:800px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
  <h1>Currency Converter</h1>
  <div class="meta">
    Live exchange rates • Global currencies • No login • Privacy-first
  </div>
</div>

<div class="grid">

<div>
  <div class="group">
    <label>Amount</label>
    <input type="number" id="amount" placeholder="e.g. 100">
  </div>

  <div class="group" style="margin-top:16px">
    <label>From</label>
    <select id="from"></select>
  </div>

  <div class="group" style="margin-top:16px">
    <label>To</label>
    <select id="to"></select>
  </div>
</div>

<div class="result">
  Converted Amount
  <strong id="result">—</strong>
  <div id="status" style="font-size:12px;opacity:.9;margin-top:6px">
    Loading live rates…
  </div>
</div>

</div>

<div class="footer">
Rates update automatically. All calculations run in your browser.
</div>

</div>

<script>
const amount = document.getElementById("amount");
const from = document.getElementById("from");
const to = document.getElementById("to");
const result = document.getElementById("result");
const status = document.getElementById("status");

/* Currency list */
const currencies = {
USD:"US Dollar",
INR:"Indian Rupee",
EUR:"Euro",
GBP:"British Pound",
JPY:"Japanese Yen",
AUD:"Australian Dollar",
CAD:"Canadian Dollar",
CHF:"Swiss Franc",
CNY:"Chinese Yuan",
SGD:"Singapore Dollar",
NZD:"New Zealand Dollar",
ZAR:"South African Rand",
AED:"UAE Dirham",
SAR:"Saudi Riyal",
PKR:"Pakistani Rupee",
BDT:"Bangladeshi Taka",
LKR:"Sri Lankan Rupee",
THB:"Thai Baht",
MYR:"Malaysian Ringgit",
IDR:"Indonesian Rupiah"
};

/* Populate dropdowns */
for(const code in currencies){
from.innerHTML += `<option value="${code}">${code} – ${currencies[code]}</option>`;
to.innerHTML   += `<option value="${code}">${code} – ${currencies[code]}</option>`;
}
to.value = "INR";

let rates = {};

/* Fetch live rates (USD base) */
async function fetchRates(){
try{
  const res = await fetch("https://api.exchangerate.host/latest");
  const data = await res.json();
  rates = data.rates;
  localStorage.setItem("rates", JSON.stringify(rates));
  status.textContent = "Live rates updated ✔";
}catch{
  rates = JSON.parse(localStorage.getItem("rates") || "{}");
  status.textContent = "Offline mode (cached rates)";
}
convert();
}

function convert(){
const amt = parseFloat(amount.value);
if(!amt || !rates[from.value] || !rates[to.value]){
  result.textContent = "—";
  return;
}
const usd = amt / rates[from.value];
const converted = usd * rates[to.value];
result.textContent = converted.toFixed(2) + " " + to.value;
}

/* Events */
[amount, from, to].forEach(el =>
el.addEventListener("input", convert)
);

fetchRates();
</script>

</body>
</html>
