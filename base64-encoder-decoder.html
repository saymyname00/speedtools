<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Base64 Encoder / Decoder – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 20% 20%,#fbcfe8,transparent 40%),
radial-gradient(circle at 80% 80%,#bfdbfe,transparent 45%),
linear-gradient(135deg,#f8fafc,#ecfeff);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#111;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;
text-decoration:none;font-size:14px;font-weight:600;
padding:8px 14px;border-radius:999px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
color:#111;
box-shadow:0 10px 26px rgba(0,0,0,.12);
}

/* CARD */
.card{
width:95%;max-width:1150px;
background:#fff;
padding:26px;
border-radius:26px;
box-shadow:0 28px 60px rgba(0,0,0,.15);
}

.header{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:6px
}
.header h1{font-size:30px;margin:0}
.badge{
font-size:12px;
background:linear-gradient(135deg,#ec4899,#8b5cf6);
color:#fff;
padding:6px 12px;border-radius:999px
}
.subtitle{font-size:14px;color:#555;margin-bottom:14px}

/* LAYOUT */
.main{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px
}

/* TEXTAREA */
textarea{
width:100%;
height:260px;
padding:18px;
font-size:14px;
border-radius:18px;
border:1px solid #ddd;
resize:none;
outline:none;
font-family:Inter;
background:#f9fafb;
}
textarea:focus{
border-color:#8b5cf6;
box-shadow:0 0 0 3px rgba(139,92,246,.15);
background:#fff;
}

/* ACTIONS */
.actions{
display:flex;
gap:12px;
margin-top:12px;
flex-wrap:wrap;
}
button{
flex:1;
padding:13px;
border-radius:16px;
border:none;
font-size:14px;
font-family:Inter;
cursor:pointer;
}
.encode{
background:linear-gradient(135deg,#ec4899,#8b5cf6);
color:#fff;
box-shadow:0 10px 30px rgba(139,92,246,.4)
}
.decode{
background:linear-gradient(135deg,#22c55e,#4ade80);
color:#052e16;
box-shadow:0 10px 30px rgba(34,197,94,.4)
}
.copy{background:#e5e7eb}
.clear{background:#f1f5f9}

/* STATUS */
.status{
margin-top:12px;
padding:12px;
border-radius:14px;
font-size:13px;
display:none;
}
.ok{background:#dcfce7;color:#065f46}
.err{background:#fee2e2;color:#7f1d1d}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;margin-top:12px
}
.stat{
background:linear-gradient(135deg,#fdf2f8,#eff6ff);
padding:12px;border-radius:14px;
text-align:center;font-size:13px
}
.stat strong{display:block;font-size:18px}

/* MOBILE */
@media(max-width:900px){
.main{grid-template-columns:1fr}
textarea{height:220px}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
<h1>Base64 Encoder / Decoder</h1>
<div class="badge">Text Tool</div>
</div>
<p class="subtitle">Encode or decode text using Base64 instantly in your browser.</p>

<div class="main">
<textarea id="input" placeholder="Enter text here..."></textarea>
<textarea id="output" placeholder="Result will appear here..." readonly></textarea>
</div>

<div class="actions">
<button class="encode" onclick="encodeText()">Encode</button>
<button class="decode" onclick="decodeText()">Decode</button>
<button class="copy" onclick="copyText()">Copy</button>
<button class="clear" onclick="clearAll()">Clear</button>
</div>

<div id="status" class="status"></div>

<div class="stats">
<div class="stat"><strong id="inLen">0</strong>Input Length</div>
<div class="stat"><strong id="outLen">0</strong>Output Length</div>
<div class="stat"><strong id="ratio">—</strong>Size Ratio</div>
</div>

</div>

<script>
const input=document.getElementById("input");
const output=document.getElementById("output");
const statusBox=document.getElementById("status");

const inLen=document.getElementById("inLen");
const outLen=document.getElementById("outLen");
const ratio=document.getElementById("ratio");

input.addEventListener("input",()=>{
inLen.textContent=input.value.length;
});

function encodeText(){
try{
const encoded=btoa(unescape(encodeURIComponent(input.value)));
output.value=encoded;
showStatus("Encoded successfully ✓","ok");
updateStats(encoded);
}catch(e){
showStatus("Encoding failed ❌","err");
}
}

function decodeText(){
try{
const decoded=decodeURIComponent(escape(atob(input.value)));
output.value=decoded;
showStatus("Decoded successfully ✓","ok");
updateStats(decoded);
}catch(e){
showStatus("Invalid Base64 ❌","err");
}
}

function showStatus(msg,type){
statusBox.textContent=msg;
statusBox.className="status "+type;
statusBox.style.display="block";
}

function updateStats(text){
outLen.textContent=text.length;
ratio.textContent=input.value.length
? (text.length/input.value.length).toFixed(2)
: "—";
}

function copyText(){
if(output.value) navigator.clipboard.writeText(output.value);
}

function clearAll(){
input.value="";
output.value="";
statusBox.style.display="none";
inLen.textContent=0;
outLen.textContent=0;
ratio.textContent="—";
}
</script>

</body>
</html>
