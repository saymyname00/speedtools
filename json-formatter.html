<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JSON Formatter – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 20% 20%,#bfdbfe,transparent 40%),
radial-gradient(circle at 80% 80%,#fde68a,transparent 45%),
linear-gradient(135deg,#f8fafc,#ecfeff);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#111;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;
text-decoration:none;font-size:14px;font-weight:600;
padding:8px 14px;border-radius:999px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
color:#111;
box-shadow:0 10px 26px rgba(0,0,0,.12);
}

/* CARD */
.card{
width:95%;max-width:1150px;
background:#fff;padding:26px;
border-radius:26px;
box-shadow:0 28px 60px rgba(0,0,0,.15);
}

.header{
display:flex;justify-content:space-between;align-items:center;margin-bottom:6px
}
.header h1{font-size:30px;margin:0}
.badge{
font-size:12px;
background:linear-gradient(135deg,#3b82f6,#22c55e);
color:#052e16;
padding:6px 12px;border-radius:999px
}
.subtitle{font-size:14px;color:#555;margin-bottom:14px}

/* LAYOUT */
.main{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px
}

/* TEXTAREA */
textarea{
width:100%;
height:260px;
padding:18px;
font-size:14px;
border-radius:18px;
border:1px solid #ddd;
resize:none;
outline:none;
font-family:Inter;
background:#f9fafb;
}
textarea:focus{
border-color:#3b82f6;
box-shadow:0 0 0 3px rgba(59,130,246,.15);
background:#fff;
}

/* ACTIONS */
.actions{
display:flex;
gap:12px;
margin-top:12px;
flex-wrap:wrap;
}
button{
flex:1;
padding:13px;
border-radius:16px;
border:none;
font-size:14px;
font-family:Inter;
cursor:pointer;
}
.pretty{
background:linear-gradient(135deg,#3b82f6,#22c55e);
color:#052e16;
box-shadow:0 10px 30px rgba(59,130,246,.35)
}
.minify{background:#e5e7eb}
.validate{background:#fde68a}
.copy{background:#f1f5f9}
.clear{background:#fef2f2}

/* STATUS */
.status{
margin-top:12px;
padding:12px;
border-radius:14px;
font-size:13px;
display:none;
}
.ok{
background:#dcfce7;color:#065f46
}
.err{
background:#fee2e2;color:#7f1d1d
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;margin-top:12px
}
.stat{
background:linear-gradient(135deg,#f0fdf4,#ecfeff);
padding:12px;border-radius:14px;
text-align:center;font-size:13px
}
.stat strong{display:block;font-size:18px}

/* MOBILE */
@media(max-width:900px){
.main{grid-template-columns:1fr}
textarea{height:220px}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
<h1>JSON Formatter</h1>
<div class="badge">Validate & Clean</div>
</div>
<p class="subtitle">Format, minify and validate JSON instantly in your browser.</p>

<div class="main">
<textarea id="input" placeholder='Paste JSON here...'></textarea>
<textarea id="output" placeholder="Formatted JSON will appear here..." readonly></textarea>
</div>

<div class="actions">
<button class="pretty" onclick="formatJSON()">Pretty Format</button>
<button class="minify" onclick="minifyJSON()">Minify</button>
<button class="validate" onclick="validateJSON()">Validate</button>
<button class="copy" onclick="copyJSON()">Copy</button>
<button class="clear" onclick="clearAll()">Clear</button>
</div>

<div id="status" class="status"></div>

<div class="stats">
<div class="stat"><strong id="keys">0</strong>Keys</div>
<div class="stat"><strong id="size">0</strong>Characters</div>
<div class="stat"><strong id="depth">0</strong>Depth</div>
</div>

</div>

<script>
const input=document.getElementById("input");
const output=document.getElementById("output");
const statusBox=document.getElementById("status");

const keysEl=document.getElementById("keys");
const sizeEl=document.getElementById("size");
const depthEl=document.getElementById("depth");

function parse(){
return JSON.parse(input.value);
}

function formatJSON(){
try{
const obj=parse();
const formatted=JSON.stringify(obj,null,2);
output.value=formatted;
showStatus("Valid JSON ✓","ok");
updateStats(obj,formatted);
}catch(e){
showStatus("Invalid JSON ❌","err");
}
}

function minifyJSON(){
try{
const obj=parse();
const min=JSON.stringify(obj);
output.value=min;
showStatus("Minified successfully","ok");
updateStats(obj,min);
}catch(e){
showStatus("Invalid JSON ❌","err");
}
}

function validateJSON(){
try{
parse();
showStatus("JSON is valid ✓","ok");
}catch(e){
showStatus("Invalid JSON ❌","err");
}
}

function showStatus(msg,type){
statusBox.textContent=msg;
statusBox.className="status "+type;
statusBox.style.display="block";
}

function copyJSON(){
if(output.value) navigator.clipboard.writeText(output.value);
}

function clearAll(){
input.value="";
output.value="";
statusBox.style.display="none";
updateStats({}, "");
}

function updateStats(obj,text){
sizeEl.textContent=text.length;
keysEl.textContent=countKeys(obj);
depthEl.textContent=getDepth(obj);
}

function countKeys(o){
if(typeof o!=="object"||o===null) return 0;
let c=0;
for(let k in o){
c++;
c+=countKeys(o[k]);
}
return c;
}

function getDepth(o){
if(typeof o!=="object"||o===null) return 0;
let d=0;
for(let k in o){
d=Math.max(d,getDepth(o[k]));
}
return d+1;
}
</script>

</body>
</html>
