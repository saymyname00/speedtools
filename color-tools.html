<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Tools – SpeedTools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="assets/favicon/site.webmanifest">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:
radial-gradient(circle at 20% 20%,#fde68a,transparent 40%),
radial-gradient(circle at 80% 80%,#a7f3d0,transparent 45%),
linear-gradient(135deg,#f8fafc,#ecfeff);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#111;
}

/* HOME */
.home-btn{
position:fixed;top:18px;left:18px;
text-decoration:none;font-size:14px;font-weight:600;
padding:8px 14px;border-radius:999px;
background:rgba(255,255,255,.8);
backdrop-filter:blur(12px);
color:#111;
box-shadow:0 10px 26px rgba(0,0,0,.12);
transition:.2s;z-index:999;
}
.home-btn:hover{transform:translateY(-1px)}

/* CARD */
.card{
width:95%;max-width:1000px;
background:#fff;padding:26px;
border-radius:22px;
box-shadow:0 28px 60px rgba(0,0,0,.14);
}

.header{
display:flex;justify-content:space-between;align-items:center;margin-bottom:8px
}
.header h1{font-size:30px;margin:0}
.badge{
font-size:12px;
background:linear-gradient(135deg,#f59e0b,#22c55e);
color:#052e16;
padding:6px 12px;border-radius:999px
}
.subtitle{font-size:14px;color:#555;margin-bottom:14px}

/* LAYOUT */
.main{
display:grid;grid-template-columns:1fr 1fr;gap:18px
}

/* LEFT */
.left{
background:#f8fafc;
padding:18px;
border-radius:18px;
}
.color-preview{
height:160px;
border-radius:16px;
margin-bottom:12px;
box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
display:flex;
align-items:center;
justify-content:center;
font-weight:600;
}
input[type=color]{
width:100%;
height:44px;
border:none;
cursor:pointer;
border-radius:10px;
}

/* RIGHT */
.right{
display:grid;
grid-template-columns:1fr;
gap:10px;
}
.field{
background:#f8fafc;
padding:12px;
border-radius:14px;
display:flex;
gap:8px;
align-items:center;
}
.field input{
flex:1;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
}
.field button{
padding:10px 14px;
border-radius:10px;
border:none;
cursor:pointer;
background:#e5e7eb;
font-size:13px;
}

/* FOOTER */
.footer{
margin-top:12px;
text-align:center;
font-size:12px;
color:#666
}

/* MOBILE */
@media(max-width:900px){
.main{grid-template-columns:1fr}
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<div class="card">

<div class="header">
<h1>Color Tools</h1>
<div class="badge">Premium</div>
</div>

<p class="subtitle">
Pick a color and instantly convert between HEX, RGB and HSL.
</p>

<div class="main">

<div class="left">
<div class="color-preview" id="preview">Preview</div>
<input type="color" id="picker" value="#22c55e">
</div>

<div class="right">

<div class="field">
<input id="hex" placeholder="HEX">
<button onclick="copy(hex.value)">Copy</button>
</div>

<div class="field">
<input id="rgb" placeholder="RGB">
<button onclick="copy(rgb.value)">Copy</button>
</div>

<div class="field">
<input id="hsl" placeholder="HSL">
<button onclick="copy(hsl.value)">Copy</button>
</div>

</div>

</div>

<div class="footer">
🎨 Color picker • 🔁 Live convert • 🚫 No login • Browser based
</div>

</div>

<script>
const picker=document.getElementById("picker");
const preview=document.getElementById("preview");
const hex=document.getElementById("hex");
const rgb=document.getElementById("rgb");
const hsl=document.getElementById("hsl");

function hexToRgb(h){
let r=parseInt(h.substring(1,3),16);
let g=parseInt(h.substring(3,5),16);
let b=parseInt(h.substring(5,7),16);
return {r,g,b};
}

function rgbToHsl(r,g,b){
r/=255;g/=255;b/=255;
let max=Math.max(r,g,b),min=Math.min(r,g,b);
let h,s,l=(max+min)/2;
if(max===min){h=s=0;}
else{
let d=max-min;
s=l>0.5?d/(2-max-min):d/(max+min);
switch(max){
case r:h=(g-b)/d+(g<b?6:0);break;
case g:h=(b-r)/d+2;break;
case b:h=(r-g)/d+4;break;
}
h/=6;
}
return `hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
}

function update(){
const h=picker.value;
preview.style.background=h;
hex.value=h;
const {r,g,b}=hexToRgb(h);
rgb.value=`rgb(${r}, ${g}, ${b})`;
hsl.value=rgbToHsl(r,g,b);
}

picker.addEventListener("input",update);
update();

function copy(v){
if(!v) return;
navigator.clipboard.writeText(v);
}
</script>

</body>
</html>
